/* ===== Etapa 8: aviso de mensagem dentro do app (faixa no topo) ===== */
.msg-banner{position:fixed;z-index:120;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:min(calc(100% - 16px),460px);display:flex;align-items:center;gap:2px;padding:6px 4px 6px 8px;border-radius:20px;background:color-mix(in srgb,#201d17 92%,transparent);color:#f1ecdf;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px -10px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);touch-action:none;animation:mbIn .32s cubic-bezier(.2,.8,.2,1)}
:root:not([data-mode=dark]) .msg-banner{background:color-mix(in srgb,#fff 94%,transparent);color:#262626;border-color:rgba(0,0,0,.08);box-shadow:0 14px 40px -12px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.08)}
@keyframes mbIn{from{opacity:0;transform:translate(-50%,-24px)}to{opacity:1;transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){.msg-banner{animation:none}}
.msg-banner .mb-main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:2px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:14px}
.msg-banner .mb-main .avatar{width:42px!important;height:42px!important;flex:none}
.msg-banner .mb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.msg-banner .mb-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.msg-banner .mb-name{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-banner .mb-top small{flex:none;font-size:11.5px;opacity:.6}
.msg-banner .mb-sub{font-size:14px;line-height:1.3;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.msg-banner .mb-sub em{font-style:normal;font-weight:700;color:var(--accent)}
.msg-banner .mb-x{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:inherit;opacity:.55;font-size:22px;line-height:1;cursor:pointer}
.msg-banner .mb-x:hover{opacity:.9;background:rgba(127,127,127,.15)}
.msg-banner button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Etapa 9: câmera no chat e foto de visualização única ===== */
.nx-cam{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:flex;flex-direction:column}
.cam-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
.cam-to{flex:1;font-size:14px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam-ic{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1;cursor:pointer;flex:none}
.cam-top .cam-ic:first-child+.cam-ic{margin-left:auto}
.cam-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam-video,.cam-shot{width:100%;height:100%;object-fit:cover;background:#111}
.cam-shot{object-fit:contain}
.cam-video.mirror{transform:scaleX(-1)}
.cam-err{max-width:320px;text-align:center;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.cam-err p{margin:0;opacity:.85;line-height:1.45}
.cam-bottom{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px);min-height:112px}
.cam-shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;cursor:pointer}
.cam-shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s}
.cam-shutter:active i{transform:scale(.88)}
.cam-shutter:disabled{opacity:.4}
.cam-pill{border:0;border-radius:999px;padding:12px 16px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.cam-once{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px 9px 9px;background:transparent;color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.cam-once.on{background:#fff;color:#111;border-color:#fff}
.once-ic{width:24px;height:24px;flex:none;border-radius:50%;border:2px dashed currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.cam-send{width:56px;height:56px;margin-left:auto;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;flex:none}
.cam-bottom .cam-pill+.cam-send{margin-left:auto}
.nx-cam button:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* visualização única: o próprio balão (com a cor normal de enviada/recebida) envolve ícone + texto + horário, sem caixa extra */
.once-chip{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.once-chip>span:last-child{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.once-chip b{font-size:15px;font-weight:600}.once-chip small{font-size:12px;opacity:.72;overflow-wrap:anywhere}
.once-chip .once-ic{width:26px;height:26px;color:var(--accent)}
.once-chip.mine{cursor:default}.once-chip.mine .once-ic{color:currentColor}
.once-chip.done{cursor:default;opacity:.75}.once-chip.done .once-ic{color:var(--muted)}
.once-chip:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.chat.dm .bubble:has(>.once-chip){display:flex;flex-wrap:nowrap;align-items:flex-end;column-gap:12px;padding:8px 12px 7px 10px}
.chat.dm .bubble:has(>.once-chip)>.meta{margin:0;padding:0 0 1px;flex:none}
.once-view{background:#000!important}
.once-view img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none}
.once-note{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px;white-space:nowrap}
@media(max-width:360px){.cam-once{font-size:13px;padding-right:10px}.cam-bottom{gap:10px}}
.cam-pill,.cam-once{white-space:nowrap}
@media(max-width:360px){.cam-pill{padding:10px 12px;font-size:13.5px}.cam-once{padding:7px 10px 7px 7px;font-size:13px}.cam-send{width:52px;height:52px}}

/* ===== Etapa 10: campo de mensagem (textarea que cresce) e aviso "novas mensagens" ===== */
.chat textarea#msg{resize:none;display:block;box-sizing:border-box;font:inherit;line-height:20px;overflow-y:auto;scrollbar-width:none}
.chat textarea#msg::-webkit-scrollbar{display:none}
.chat.dm .inputbar textarea#msg{height:40px;min-height:40px;max-height:124px;padding:10px 6px;font-size:16px;align-self:center}
.chat.dm .inputbar{align-items:flex-end}
.chat.dm .inputbar .icon-btn,.chat.dm .inputbar .btn.send{margin-bottom:1px}
.chat .msgs{overflow-anchor:none;overscroll-behavior:contain}
.new-below{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b,0px));z-index:6;border:0;border-radius:999px;padding:8px 14px;background:var(--accent);color:#fff;font:inherit;font-size:13.5px;font-weight:700;box-shadow:0 8px 22px -8px rgba(0,0,0,.5);cursor:pointer}

/* ===== Etapa 13: conversa inteira no estilo Instagram Direct (fundo, cabeçalho, mensagens, barra) ===== */
/* tokens da conversa: uma tela contínua (preto no escuro, branco no claro), recebidas cinza, enviadas em degradê azul→roxo */
.chat.dm{--bg:#ffffff;--rx:#efefef;--rx-line:transparent;--ph:#efefef;--ink:#000;--sub:#737373;--bar:#efefef;--icon:#000;
  --me:var(--bubble-me,#4f5ce8);--me-grad:linear-gradient(135deg,#3f8cf5 0%,#6a4ff0 55%,#9b3ff0 100%);background:var(--bg);color:var(--ink)}
:root[data-mode=dark] .chat.dm{--bg:#000;--card:#121212;--card2:#262626;--line:#262626;--text:#f5f5f5;--muted:#a8a8a8;--rx:#262626;--rx-line:transparent;--ph:#1a1a1a;--ink:#f5f5f5;--sub:#a8a8a8;--bar:#262626;--icon:#f5f5f5}
:root[data-mode=dark] body:has(.chat.dm),:root[data-mode=dark] .shell:has(.chat.dm){background:#000}
.chat.dm .msgs{background:var(--bg)}
/* cabeçalho compacto, sem divisória, fixo no topo da conversa */
.chat.dm header{position:relative;z-index:3;display:flex;align-items:center;gap:10px;min-height:56px;padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px 4px;background:var(--bg);border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.chat.dm header .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:50%;background:transparent;color:var(--icon);flex:none}
.chat.dm header .prof-btn{flex:none;padding:0;border:0;background:none}
.chat.dm header .prof-btn .avatar,.chat.dm header>.avatar{width:36px!important;height:36px!important;border-radius:50%;object-fit:cover}
.chat.dm header .grow{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;cursor:pointer}
.chat.dm header .title{font-size:16px;font-weight:700;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat.dm header .small-t{font-size:12.5px;line-height:1.2;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.chat.dm header .status-pill{margin-top:2px}
.chat.dm header .ghost-ic{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;background:transparent!important;color:var(--icon);opacity:1}
.chat.dm header .ghost-ic svg{width:24px;height:24px}
.chat.dm header .ghost-ic:hover,.chat.dm header .back:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)!important}
/* mensagens */
.chat.dm .msgs{padding:8px 10px 2px}
.chat.dm .row{gap:6px;margin-bottom:8px}
.chat.dm .row.join-next{margin-bottom:2px}
.chat.dm .col{max-width:min(74%,440px)}
.chat.dm .bubble{font-size:15px;line-height:1.35;padding:8px 12px 7px;border-radius:22px;border:0;box-shadow:none;column-gap:8px}
.chat.dm .bubble:not(.me){background:var(--rx);border:0;color:var(--ink)}
.chat.dm .bubble.me:not(:has(>.chat-img)){background-color:var(--me)!important;background-image:var(--me-grad)!important;color:#fff}
.chat.dm.has-color .bubble.me{background-image:none!important}
.chat.dm .row.mine.join-prev .bubble.me{border-top-right-radius:6px}.chat.dm .row.mine.join-next .bubble.me{border-bottom-right-radius:6px}
.chat.dm .row:not(.mine).join-prev .bubble{border-top-left-radius:6px}.chat.dm .row:not(.mine).join-next .bubble{border-bottom-left-radius:6px}
.chat.dm .row.mine:not(.join-next) .bubble.me{border-bottom-right-radius:22px}.chat.dm .row:not(.mine):not(.join-next) .bubble{border-bottom-left-radius:22px}
.chat.dm .meta{font-size:10.5px;opacity:1;color:var(--sub)}
.chat.dm .bubble.me .meta,.chat.dm .bubble.me .time{color:rgba(255,255,255,.75)}
.chat.dm .tick{color:inherit}.chat.dm .bubble.me .tick.read{color:#fff}
.chat.dm .day-sep{margin:14px auto 8px;font-size:11.5px;font-weight:600;color:var(--sub)}
.chat.dm .row>.prof-btn .avatar,.chat.dm .row>.avatar{width:28px!important;height:28px!important}
.chat.dm .dots{color:var(--sub)}
/* fotos: sem moldura; horário discreto abaixo */
.chat.dm .bubble>.chat-img{border:0;border-radius:20px;background:var(--ph);max-width:min(100%,260px)}
.chat.dm .row:not(.mine) .bubble:has(>.chat-img)>.txt{background:var(--rx);border:0}
.chat.dm .row.mine .bubble:has(>.chat-img)>.txt{background-color:var(--me);background-image:var(--me-grad);color:#fff}
.chat.dm.has-color .row.mine .bubble:has(>.chat-img)>.txt{background-image:none}
/* visualização única: mesmo balão das outras mensagens */
.chat.dm .bubble:has(>.once-chip){padding:9px 12px 8px 10px}
.chat.dm .once-chip .once-ic{width:28px;height:28px;font-size:12.5px;border-width:2px}
.chat.dm .row:not(.mine) .once-chip:not(.done) .once-ic{color:#a855f7}
/* referência de resposta e prévia */
.chat.dm .bubble:not(.me) .qref{background:color-mix(in srgb,var(--ink) 8%,transparent);border-left-color:#7c5cf0}
.chat.dm .reply-bar{background:var(--bar);border:0;border-left:3px solid #7c5cf0;border-radius:16px}
/* barra de digitação: pílula única, câmera em destaque à esquerda (como no Direct) */
.chat.dm .inputbar{margin:4px 8px calc(env(safe-area-inset-bottom,0px) + 8px);padding:4px 6px 4px 4px;gap:2px;min-height:48px;border:0;border-radius:24px;background:var(--bar);align-items:flex-end;box-shadow:none}
.chat.dm .inputbar:focus-within{box-shadow:none;border:0}
.chat.dm .inputbar #cam-btn{order:0;width:40px;height:40px;border-radius:50%;background:var(--me-grad)!important;color:#fff!important;margin:0 2px 0 0}
.chat.dm.has-color .inputbar #cam-btn{background:var(--me)!important}
.chat.dm .inputbar #cam-btn svg{width:21px;height:21px}
.chat.dm .inputbar #msg{order:1;flex:1;color:var(--ink)}
.chat.dm .inputbar #msg::placeholder{color:var(--sub)}
.chat.dm .inputbar #attach{order:3}.chat.dm .inputbar #sticker-btn{order:2}.chat.dm .inputbar .mic,.chat.dm .inputbar .btn.send{order:5}
.chat.dm .inputbar .icon-btn{width:38px;height:40px;color:var(--icon);background:transparent!important;flex:none}
.chat.dm .inputbar .icon-btn svg{width:23px;height:23px}
.chat.dm .inputbar .icon-btn.mic{color:var(--icon)!important}
.chat.dm .inputbar .btn.send{width:44px;height:44px;border:4px solid transparent;background:var(--me-grad)!important;background-clip:padding-box!important;-webkit-background-clip:padding-box!important;margin:-2px -2px -2px 0;box-sizing:border-box}
.chat.dm.has-color .inputbar .btn.send{background:var(--me)!important;background-clip:padding-box!important}
@media(max-width:360px){.chat.dm .inputbar{gap:0;padding-right:4px}.chat.dm .inputbar .icon-btn{width:36px}.chat.dm .inputbar #cam-btn{width:36px;height:36px;margin-top:2px}.chat.dm .col{max-width:80%}}
.chat.dm .new-below{background:var(--me-grad);bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.chat.dm .ideas .idea{border-color:color-mix(in srgb,#7c5cf0 60%,transparent)}

/* ===== Etapa 15: tempo real ("digitando…", "online agora", "visto por último") ===== */
.chat.dm header .small-t.is-typing{color:#a78bfa;font-weight:600}
.chat.dm header .small-t.is-online{color:#22c55e;font-weight:600}
.chat.dm header .small-t.is-online::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:1px}

/* ---- Etapa 16: reações (dois toques = ❤️, segurar = barra de reações e menu) ---- */
.chat.dm .bubble, .chat.dm .once-chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chat.dm .row{-webkit-tap-highlight-color:transparent}
.chat.dm .row.mine .menu{left:auto;right:0}
.chat.dm .menu{z-index:9;min-width:170px;border-radius:14px}
.chat.dm .menu .menu-copy{font-weight:500}
.chat.dm .picker{z-index:10;padding:6px 8px;border-radius:28px;animation:rx-pop .16s cubic-bezier(.2,.9,.3,1.3)}
.chat.dm .picker button{font-size:26px;padding:4px 6px}
.chat.dm .rpills{margin-top:-8px;position:relative;z-index:2;padding:0 8px}
.chat.dm .row.mine .rpills{justify-content:flex-end}
.chat.dm .rpill{font-size:14px;line-height:20px;padding:1px 6px;border-radius:12px;background:var(--card2,#262626);border:2px solid var(--bg,#000)}
.chat.dm .rpill.mine{background:var(--card2,#262626);border-color:var(--bg,#000)}
.chat.dm .rpill.pop{animation:rx-pop .25s cubic-bezier(.2,.9,.3,1.4)}
@keyframes rx-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.chat.dm .picker,.chat.dm .rpill.pop{animation:none}}
.chat.dm .menu.under-picker{top:calc(100% + 58px)}

/* ---- Etapa 17: apagar para todos e editar ---- */
.chat.dm .bubble.is-deleted{background:transparent!important;border:1px solid var(--line)!important;box-shadow:none!important}
.chat.dm .deleted-txt{font-style:italic;color:var(--muted)!important;font-size:14px}
.chat.dm .bubble.is-deleted .meta .time{color:var(--muted)}
.chat.dm .meta .edited{font-size:11px;opacity:.75;margin-right:4px}
.chat.dm .menu .menu-edit{font-weight:500}
.chat.dm .edit-bar{border-left-color:#f5a524!important}
.del-confirm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.del-confirm .del-box{background:var(--card);color:var(--text);border-radius:18px;padding:20px 18px 14px;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.del-confirm b{font-size:17px}
.del-confirm p{margin:8px 0 16px;color:var(--muted);font-size:14px;line-height:1.4}
.del-confirm .del-act{display:flex;gap:8px;justify-content:flex-end}
.del-confirm .danger-btn{background:#ef4444;color:#fff;border-color:#ef4444}
.chat.dm .bubble.me.is-deleted:not(:has(>.chat-img)),.chat.dm .bubble.is-deleted{background-color:transparent!important;background-image:none!important;color:var(--muted)}
.chat.dm .bubble.me.is-deleted .meta,.chat.dm .bubble.me.is-deleted .time,.chat.dm .bubble.me.is-deleted .tick{color:var(--muted)}

/* ---- Etapa 20: lista de Chats mais viva ---- */
.chats .av-wrap{position:relative;flex:none;display:inline-flex;width:52px;height:52px}
.chats .on-dot{position:absolute;right:0;bottom:1px;width:14px;height:14px;border-radius:50%;background:#22c55e;border:2.5px solid var(--bg,#000)}
@media(max-width:360px){.chats .av-wrap{width:48px;height:48px}}
.chats .convo .last.is-typing{color:#22c55e;font-weight:600;font-style:italic}
.chats .convo .last.is-react{font-style:italic}
.chats .convo .last.is-gone{font-style:italic;opacity:.8}
.chats .ct-pin,.chats .ct-mute{font-size:12px;margin-left:4px;vertical-align:1px;opacity:.85}
.chats .convo.pinned{background:color-mix(in srgb,var(--card2,#262626) 55%,transparent)}
.chats .convo{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.convo-menu-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.convo-menu{width:100%;max-width:480px;background:var(--card,#121212);color:var(--text,#f5f5f5);border-radius:20px 20px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px;box-shadow:0 -10px 40px rgba(0,0,0,.45);animation:cm-up .18s ease-out}
.convo-menu b{padding:8px 12px 10px;font-size:15px;color:var(--muted,#a8a8a8)}
.convo-menu button{background:none;border:0;color:inherit;text-align:left;font-size:16px;padding:14px 12px;border-radius:12px}
.convo-menu button:hover,.convo-menu button:focus-visible{background:var(--card2,#262626)}
.convo-menu .cm-cancel{color:var(--muted,#a8a8a8);margin-top:4px;text-align:center}
@keyframes cm-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.convo-menu{animation:none}}

/* ---- Etapa 21: áudio (gravar segurando, velocidade, mini player) ---- */
.audio .rate{flex:none;background:color-mix(in srgb,currentColor 16%,transparent);color:inherit;border:0;border-radius:10px;padding:3px 7px;font-size:12px;font-weight:700;min-width:36px}
.chat.dm .audio{gap:8px}
.chat.dm .audio .wave{cursor:pointer}
.chat.dm .inputbar{position:relative}
.chat.dm .inputbar #mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chat.dm .inputbar #mic.hot{color:#fff!important;background:#ef4444!important;transform:scale(1.25);box-shadow:0 0 0 6px rgba(239,68,68,.25);transition:transform .12s;z-index:3}
.chat.dm .inputbar .rec-hold{position:absolute;left:8px;right:56px;top:6px;bottom:6px;z-index:2;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:24px;background:var(--bar,#262626);color:var(--text,#f5f5f5)}
.chat.dm .inputbar .rec-hold span{margin-left:auto;font-size:13px;color:var(--muted,#a8a8a8)}
.chat.dm .inputbar .rec-hold.armed span{color:#ef4444;font-weight:700}
.chat.dm .inputbar.holding>*:not(.rec-hold):not(#mic){visibility:hidden}
.mini-audio{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:6px 8px 6px 6px;border-radius:28px;background:var(--card,#201d17);color:var(--text,#eee);border:1px solid var(--line,#3d3829);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.mini-audio .ma-play{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent,#e1306c);color:#fff;font-size:13px;flex:none}
.mini-audio .ma-txt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.mini-audio .ma-txt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.mini-audio .ma-txt small{font-size:11px;color:var(--muted,#a8a8a8);font-variant-numeric:tabular-nums}
.mini-audio .ma-rate{border:0;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700;background:var(--card2,#2c2820);color:inherit;flex:none}
.mini-audio .ma-x{border:0;background:none;color:var(--muted,#a8a8a8);font-size:22px;line-height:1;padding:0 6px;flex:none}

/* ---- Etapa 22: várias fotos e encaminhar ---- */
.preview .pv-thumbs{display:flex;gap:6px;overflow-x:auto;max-width:62%;padding:2px 0}
.preview .pv-one{position:relative;flex:none}
.preview .pv-one img{display:block}
.preview .pv-x{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:14px;line-height:1;padding:0}
.chat.dm .preview.multi{flex-wrap:nowrap}
.chat.dm .fwd-tag{font-size:12px;font-style:italic;opacity:.75;margin:0 0 3px}
.fwd-bg{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.fwd-sheet{width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;background:var(--card,#121212);color:var(--text,#f5f5f5);border-radius:20px 20px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.45);animation:cm-up .18s ease-out}
.fwd-sheet>b{padding:2px 8px 6px;font-size:16px}
.fwd-sheet .fwd-prev{margin:0 8px 8px;padding:8px 12px;border-radius:12px;background:var(--card2,#262626);color:var(--muted,#a8a8a8);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwd-list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.fwd-row{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;text-align:left;padding:8px;border-radius:12px;font-size:16px}
.fwd-row:hover,.fwd-row:focus-visible{background:var(--card2,#262626)}
.fwd-row .fwd-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwd-row .fwd-chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted,#a8a8a8);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#fff}
.fwd-row.on .fwd-chk{background:var(--accent,#e1306c);border-color:var(--accent,#e1306c)}
.fwd-sheet .fwd-act{display:flex;gap:8px;justify-content:flex-end;padding:10px 4px 0}
@media(prefers-reduced-motion:reduce){.fwd-sheet{animation:none}}

/* Etapa 23: tela Salas no estilo do resto do app */
.rooms-page{padding-bottom:12px}
.rooms-head h2{margin:0}.rooms-head .muted{margin:2px 0 0;font-size:15px}
.rooms-seg{display:flex;width:100%;margin:14px 0 6px}.rooms-seg button{flex:1;padding:10px 8px;font-size:14px}
.rooms-note{margin:8px 2px 0;line-height:1.4}
.rooms-page .rooms{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rooms-page .rcard{gap:14px;padding:12px 14px;min-height:76px;cursor:pointer;transition:background .15s,transform .1s}
.rooms-page .rcard:hover{background:var(--card2)}.rooms-page .rcard:active{transform:scale(.99)}
.rooms-page .rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rooms-page .r-ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:26px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.rooms-page .rcard .grow{min-width:0}.rooms-page .rcard .ct{font-size:16px;font-weight:800;letter-spacing:-.1px}
.rooms-page .r-desc{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rooms-page .r-side{display:flex;align-items:center;gap:8px;flex:none}
.rooms-page .r-online{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.rooms-page .r-online i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.rooms-page .r-go{font-size:24px;color:var(--muted);line-height:1}
@media(min-width:700px){.rooms-page .rooms{display:grid;grid-template-columns:repeat(2,1fr)}}
.rooms-page .rcard .ct{color:var(--text)}

/* Etapa 24: sala ao vivo */
.room-live .room-empty{display:flex;flex-direction:column;gap:6px;text-align:center;margin:40px auto;max-width:30ch;color:var(--muted);font-size:14px;line-height:1.4}.room-live .room-empty b{color:var(--text);font-size:16px}
.room-live .room-from{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:2px}
.room-live .room-dots{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px;cursor:pointer}
.room-live .bubble{position:relative}.room-live .room-menu{top:26px;left:auto;right:0}
.room-live .room-menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--text)}.room-live .room-menu .danger{color:#d12a4b}
.room-live .room-err{margin:0 14px 6px}
.room-live .inputbar .btn.send:disabled{opacity:.5}

/* Etapa 26: responder e reagir nas salas */
.room-live .room-acts{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px;padding:4px 6px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);width:max-content;max-width:100%}
.room-live .row.mine .room-acts{margin-left:auto}
.room-live .room-rx{border:0;background:none;font-size:20px;line-height:1;padding:4px;border-radius:50%;cursor:pointer}.room-live .room-rx.mine{background:var(--accent-soft)}
.room-live .room-reply{border:0;background:none;font-size:13px;font-weight:700;color:var(--accent);padding:4px 8px;cursor:pointer}
.room-live .bubble{cursor:pointer}

/* Etapa 27: menções */
.room-live .mention{font-weight:800;color:var(--accent);border-radius:6px}
.room-live .bubble.me .mention{color:#fff;text-decoration:underline;text-underline-offset:2px}
.room-live .mention.me{background:var(--accent-soft);padding:0 3px}.room-live .bubble.me .mention.me{background:rgba(255,255,255,.22)}
.room-live .mention-list{display:flex;flex-wrap:wrap;gap:6px;margin:0 10px 6px}
.room-live .mention-opt{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r-pill);padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}

/* Etapa 28: busca na lista de Chats */
.chat-search{display:flex;align-items:center;gap:8px;margin:12px 0 4px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
.chat-search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:11px 0;font-size:16px;color:var(--text)}
.chat-search:focus-within{border-color:var(--accent)}
.chat-search input::-webkit-search-cancel-button{display:none}
.chats mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 1px;font-weight:800}
.msg-hits{display:flex;flex-direction:column}
.msg-hit{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;color:var(--text);padding:10px 8px;border-radius:16px;cursor:pointer}
.msg-hit:hover{background:var(--card2)}
.msg-hit .mh-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.msg-hit .mh-txt b{font-size:15px}.msg-hit .mh-txt span{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-hit .mh-time{font-size:12px;color:var(--muted);flex:none}
.chat-search .icon-btn{width:28px;height:28px;min-width:28px;padding:0;font-size:18px;line-height:1;border-radius:50%;flex:none}

/* Etapa 29: sala igual às conversas */
.room-live header .room-hic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.room-live .room-name{font-size:12.5px;font-weight:800;color:var(--accent);margin:0 0 2px}
.room-live .bubble{cursor:default}

/* ---- Etapa 32: não lidas por sala, digitando, perfil pela foto, trecho da denúncia ---- */
.rooms-page .r-unread,.rcard .r-unread{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:#ff3040;color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;box-shadow:0 0 0 2px var(--card)}
.rcard .r-side{display:flex;align-items:center}
.room-live .online-sub.typing{color:var(--accent);font-style:italic}
.room-live .prof-btn{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;border-radius:50%}
.room-live .room-name:hover{text-decoration:underline}
.mod-card .mod-ctx{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--bg-soft,rgba(127,127,127,.12));font-style:italic;word-break:break-word}

/* ---- Etapa 33: sobre a sala, mensagem fixada, enquetes ---- */
.room-live .pin-bar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.room-live .pin-bar .pin-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.room-live .pin-bar .pin-txt b{font-size:11px;color:var(--accent)}
.room-live .pin-bar .pin-txt span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-live .pin-bar .pin-x{font-size:20px;padding:0 6px;opacity:.7}
.about-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.about-sheet{background:var(--card);color:var(--text);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}
.about-sheet .about-head{display:flex;gap:12px;align-items:center}
.about-sheet .room-hic.big{width:52px;height:52px;font-size:28px}
.about-sheet .about-rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.about-sheet .about-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.about-sheet .about-act .btn{white-space:nowrap}
.about-sheet .inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
.room-live .poll{display:flex;flex-direction:column;gap:6px;min-width:220px}
.room-live .poll-q{font-weight:700}
.room-live .poll-opt{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.12);color:inherit;text-align:left;cursor:pointer}
.room-live .poll-opt .poll-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(127,127,127,.28);transition:width .3s;pointer-events:none}
.room-live .poll-opt.mine{border-color:var(--accent)}
.room-live .poll-opt.mine .poll-bar{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.room-live .poll-opt .po-t,.room-live .poll-opt .po-n{position:relative}
.room-live .poll-opt .po-n{font-size:12px;opacity:.85;white-space:nowrap}
.room-live .poll-foot{opacity:.8}
.post .fpoll{display:flex;flex-direction:column;gap:6px;padding:4px 14px 8px}
.post .fpoll .poll-opt,.composer .cp-poll .inp{font-size:15px}
.post .fpoll .poll-opt{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.12);color:inherit;text-align:left;cursor:pointer}
.post .fpoll .poll-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(127,127,127,.28);transition:width .3s;pointer-events:none}
.post .fpoll .poll-opt.mine{border-color:var(--accent)}
.post .fpoll .poll-opt.mine .poll-bar{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.post .fpoll .po-t,.post .fpoll .po-n{position:relative}
.post .fpoll .po-n{font-size:12px;opacity:.85;white-space:nowrap}
.composer .cp-poll{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.composer .cp-poll .inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.composer .cp-tool.on{border-color:var(--accent);color:var(--accent)}

/* ---- Etapa 34: salas da galera e prazo de enquete ---- */
.rooms-sub{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.rooms-sub h3{margin:0;font-size:15px}
.nr-emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.nr-e{font-size:22px;padding:6px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.nr-e.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.poll-ends{font-size:12px;opacity:.85}
.poll-hours{display:flex;gap:6px;flex-wrap:wrap}
.poll-hours button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer}
.poll-hours button.on{border-color:var(--accent);color:var(--accent)}
.poll-opt:disabled,.poll-opt.closed{cursor:default;opacity:.9}

/* ===== Etapa 35: moderação das salas, busca e salas em alta ===== */
.rooms-page .room-search{margin:4px 0 12px}
.rooms-page .room-search .inp{width:100%;padding:11px 14px;border-radius:var(--r-pill,999px);border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
.rooms-page .hot-strip{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding-bottom:2px}
.rooms-page .hot-strip::-webkit-scrollbar{display:none}
.rooms-page .hot-t{flex:none;font-weight:800;font-size:13px}
.rooms-page .hot-chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r-pill,999px);padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.rooms-page .hot-chip em{font-style:normal;font-size:11px;font-weight:800;background:var(--accent-soft,rgba(255,80,120,.16));color:var(--text);border-radius:999px;padding:2px 7px}
.rooms-page .r-hot{font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--accent-soft,rgba(255,80,120,.16));white-space:nowrap}
.about-sheet .ban-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.inputbar.banned{justify-content:center;text-align:center;font-size:14px;color:var(--muted);padding:14px 16px}
.menu .menu-moddel,.menu .menu-ban{color:var(--danger,#e5484d)}

/* ===== Etapa 36: animação de abertura ===== */
.splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0716;overflow:hidden;opacity:1;transition:opacity .4s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 65%);filter:blur(10px);opacity:0;animation:splash-glow 1.5s .1s ease-out both}
.splash-logo{position:relative;display:grid;place-items:center;animation:splash-pop .9s cubic-bezier(.25,.9,.3,1) both}
.splash-logo .logo-mark{box-shadow:0 10px 36px color-mix(in srgb,var(--accent) 45%,transparent)}
.splash-ring{position:absolute;inset:-14px;border-radius:30%;border:2px solid var(--accent);opacity:0;animation:splash-ring 1.1s .35s ease-out both}
.splash-word{position:relative;display:flex;gap:6px;font-size:40px;font-weight:900;letter-spacing:.14em;line-height:1}
.splash-word b{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(14px) scale(.9);animation:splash-letter .5s cubic-bezier(.2,.9,.3,1) both}
.splash-tag{position:relative;font-size:14px;font-weight:600;color:#a8a3bd;opacity:0;animation:splash-tag .6s 1.1s ease-out both}
@keyframes splash-bg{from{opacity:0}to{opacity:1}}
@keyframes splash-glow{0%{opacity:0;transform:scale(.5)}60%{opacity:1}100%{opacity:.7;transform:scale(1)}}
@keyframes splash-pop{0%{transform:translateY(46px) scale(3.1)}100%{transform:none}}
@keyframes splash-ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
@keyframes splash-letter{to{opacity:1;transform:none}}
@keyframes splash-tag{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.splash{display:none}}

/* ===== Etapa 37: gênero/preferência, fotos sem moldura de foco ===== */
.nav{outline:none;-webkit-tap-highlight-color:transparent}
.nav:focus,.nav:active{outline:none;box-shadow:none}
.nav:focus-visible{background:rgba(255,255,255,.08)}
@media(hover:none){.nav:hover{color:transparent}}
.pref-block{margin:10px 0 2px}.pref-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pref-banner{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:12px 14px}
.pref-banner .icon-btn{flex:none}

/* ===== Etapa 38 ===== */
.chats .chat-filters{display:flex;gap:8px;margin:2px 0 10px;overflow-x:auto;scrollbar-width:none}
.chats .chat-filters::-webkit-scrollbar{display:none}
.chats .chat-filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r-pill,999px);padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.chats .chat-filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* =====================================================================
   NEXO — Etapa 39: identidade própria ("caderno de fã")
   Papel quente com pontinhos, tinta preta, laranja-tomate e destaque limão.
   Contornos firmes e sombras duras em vez de gradientes e brilhos.
   Títulos em serifa, rótulos em monoespaçada. Só aparência.
   ===================================================================== */
:root{--bg:#f3eee3;--card:#fffdf7;--card2:#ebe4d3;--line:#d6ccb6;--text:#1b1a17;--muted:#645e51;--accent:#d43c14;--accent-d:#b9300d;--accent2:#d43c14;--accent-soft:rgba(212,60,20,.11);
  --hi:#d7f25a;--hi-ink:#1b1a17;--ink-b:#1b1a17;--ink-s:#1b1a17;
  --r-sm:9px;--r-md:13px;--r-lg:16px;--r-pill:9px;
  --sh-1:2px 2px 0 var(--ink-s);--sh-2:3px 3px 0 var(--ink-s);
  --f-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--f-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
:root[data-mode=dark]{--bg:#16140f;--card:#201d17;--card2:#2c2820;--line:#3d3829;--text:#f1ecdf;--muted:#a8a190;--accent:#ea5a31;--accent-d:#d4461e;--accent2:#ea5a31;--accent-soft:rgba(234,90,49,.16);
  --hi:#d7f25a;--ink-b:#6d6650;--ink-s:#000}
:root[data-mode=dark] .shell:has(.explorar),:root[data-mode=dark] .shell:has(.chats),:root[data-mode=dark] .chat.dm{--bg:#16140f;--card:#201d17;--card2:#2c2820;--line:#3d3829;--text:#f1ecdf;--muted:#a8a190}
:root[data-mode=dark] .shell:has(.explorar),:root[data-mode=dark] .shell:has(.chats){background:var(--bg)}
:root[data-mode=dark] .shell:has(.explorar) .topbar,:root[data-mode=dark] .shell:has(.chats) .topbar{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--text) 9%,transparent) 1px,transparent 1.2px);background-size:20px 20px;background-attachment:fixed}
.shell,.shell:has(.explorar){background:transparent}
:root[data-mode=dark] .shell:has(.explorar){background:transparent}

/* tipografia */
h2,.hero-title,.auth-title,.d-head h2{font-family:var(--f-serif);font-weight:800;letter-spacing:-.4px}
.hero-title{font-size:clamp(34px,9vw,46px);line-height:1.04}
.d-tagline,.muted.small-t.tagline{font-family:var(--f-mono);font-size:12px;letter-spacing:0}
.pf-lbl,.section-lbl,.eyebrow,.gostos-lbl{font-family:var(--f-mono);letter-spacing:.06em}

/* botões: sólidos, contorno de tinta, sombra dura que "afunda" ao tocar */
.btn{background:var(--accent);color:#fff;border:2px solid var(--ink-b);border-radius:var(--r-sm);box-shadow:var(--sh-2);transition:transform .08s,box-shadow .08s;filter:none}
.btn:hover:not(:disabled){filter:none;transform:none}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink-s)}
.btn:disabled{box-shadow:none;opacity:.45}
.btn.ghost{background:var(--card);color:var(--text);border:2px solid var(--ink-b);box-shadow:var(--sh-1)}
.btn.ghost:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink-s)}
.btn.small{box-shadow:var(--sh-1)}
/* etiquetas e chips: adesivos retos */
.chip{border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--hi);color:var(--hi-ink);border-color:var(--ink-b);box-shadow:var(--sh-1)}
.chip:not(.small):hover{border-color:var(--ink-b)}
.chats .chat-filters button,.momentos .mo-filters button,.d-tabs button{border-radius:var(--r-sm);border:1.5px solid var(--line)}
.chats .chat-filters button.on,.momentos .mo-filters button.on,.d-tabs button.on,.d-tabs button.active{background:var(--hi);color:var(--hi-ink);border-color:var(--ink-b)}
.seg,.seg button{border-radius:var(--r-sm)}
/* campos */
textarea,.form input:not([type=checkbox]),select,#msg,input[type=text],input[type=email],input[type=password],input[type=search]{border:1.5px solid var(--ink-b);border-radius:var(--r-sm);background:var(--card)}
input:focus,textarea:focus{outline:0;box-shadow:3px 3px 0 var(--accent)}
:root[data-mode=dark] textarea,:root[data-mode=dark] .form input:not([type=checkbox]),:root[data-mode=dark] select{border-color:var(--line)}
/* cartões */
.card,.rcard,.convo,.post,.auth-card,.onboard .card{border:1.5px solid var(--ink-b);border-radius:var(--r-md);background:var(--card);box-shadow:var(--sh-1)}
:root[data-mode=dark] .card,:root[data-mode=dark] .rcard,:root[data-mode=dark] .convo,:root[data-mode=dark] .post{border-color:var(--line)}
.r-ic{border-radius:var(--r-sm);box-shadow:none;border:1.5px solid var(--ink-b)}
.slot,.slot.add{border-radius:var(--r-md)}
.slot.add{border:2px dashed var(--ink-b)}
.main-tag{background:var(--hi);color:var(--hi-ink);border-radius:5px;font-family:var(--f-mono);font-weight:700}
/* balões */
.bubble.me,.wm.me{background:var(--accent);color:#fff;box-shadow:none}
/* barra de baixo: reta, com contorno, Chats vira um adesivo levemente torto */
@media(max-width:700px){
  .tabs{margin:0;width:auto;padding:6px 6px calc(6px + var(--safe-b));border-radius:0;border:0;border-top:2px solid var(--ink-b);background:var(--card);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-end;overflow:visible}
  :root[data-mode=dark] .tabs{background:var(--card);border-top-color:var(--line);box-shadow:none}
  .tabs>button{height:50px}
  .tabs>button.active .ic,.tabs>button.active em{color:var(--text)}
  .tabs>button.active em{font-weight:800}
  .tabs>button.active:not([data-tab=dms])::after{width:22px;height:4px;border-radius:0;background:var(--accent);bottom:-2px}
  .tabs>button em{font-family:var(--f-mono);font-size:10px;letter-spacing:0;text-transform:lowercase}
  .tabs>button[data-tab=dms] .ic{width:54px;height:46px;border-radius:var(--r-md);transform:translateY(-12px) rotate(-3deg);border:2px solid var(--ink-b);color:#fff!important;
    background:var(--accent)!important;box-shadow:3px 3px 0 var(--ink-s)!important;transition:transform .1s,box-shadow .1s}
  .tabs>button[data-tab=dms] .ic svg{width:25px;height:25px}
  .tabs>button[data-tab=dms]{margin-bottom:-4px}
  .tabs>button[data-tab=dms] em{margin-top:-8px}
  .tabs>button[data-tab=dms].active .ic{box-shadow:3px 3px 0 var(--hi),5px 5px 0 var(--ink-s)!important}
  .tabs>button[data-tab=dms]:active .ic{transform:translateY(-10px) rotate(-3deg) scale(.97)}
  .tab-badge{box-shadow:0 0 0 2px var(--card)}
}
.tabs>button.active{color:var(--text)}
/* fotos do Explorar: moldura de foto revelada, sem brilho */
.explorar .scard{border:2px solid var(--ink-b);border-radius:var(--r-lg);box-shadow:4px 4px 0 var(--ink-s)}
:root[data-mode=dark] .explorar .scard{border-color:var(--line)}
.pill,.sc-info .pill,.badge-comp,.compat{border-radius:5px;font-family:var(--f-mono);font-weight:700;letter-spacing:0}
/* links e destaques */
.link{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
/* marcas das salas: siglas em monoespaçada sobre cor chapada */
.r-ic{color:var(--hi-ink,#1b1a17);font-size:26px}
.r-ic.mono{font-family:var(--f-mono);font-weight:800;font-size:19px;letter-spacing:-.5px}
.room-hic{color:#1b1a17;border:1.5px solid var(--ink-b);border-radius:var(--r-sm)}
.room-hic:not(.big){font-family:var(--f-mono);font-weight:800}
.hot-strip .hot-t{font-family:var(--f-mono);text-transform:lowercase}
.r-hot{font-family:var(--f-mono);font-weight:700}
/* botões redondos do Explorar viram "fichas" quadradas */
.explorar .rb{border-radius:var(--r-md)}
.explorar .rb.like{box-shadow:3px 3px 0 var(--ink-s)}
.d-tagline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.d-head>div:first-child{min-width:0}
:root[data-mode=dark] body:has(.shell),:root[data-mode=dark] body:has(.chat.dm){background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--text) 9%,transparent) 1px,transparent 1.2px);background-size:20px 20px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
@media(max-width:700px){.tabs{margin-top:14px}}
:root[data-mode=dark] textarea:focus,:root[data-mode=dark] .form input:not([type=checkbox]):focus,:root[data-mode=dark] select:focus{border-color:var(--accent)}
/* a camada "chapada" antiga zerava sombras: aqui as sombras duras voltam, de propósito */
.btn:not(:disabled){box-shadow:var(--sh-2)!important}
.btn.ghost:not(:disabled),.btn.small:not(:disabled){box-shadow:var(--sh-1)!important}
.btn:active:not(:disabled){box-shadow:1px 1px 0 var(--ink-s)!important}
.chip.on,.chats .chat-filters button.on,.momentos .mo-filters button.on{background:var(--hi)!important;color:var(--hi-ink)!important;box-shadow:var(--sh-1)!important}
.explorar .rb.like{box-shadow:3px 3px 0 var(--ink-s)!important}
.empty-card{border:1.5px solid var(--ink-b);border-radius:var(--r-lg);box-shadow:var(--sh-2)}
:root[data-mode=dark] .empty-card{border-color:var(--line)}
/* busca da lista de Chats: o campo fica sem contorno próprio (o contorno é da caixa) */
.chat-search input,.chat-search input:focus{border:0!important;box-shadow:none!important;background:transparent!important;border-radius:0;outline:0}
.chat-search:focus-within{box-shadow:3px 3px 0 var(--accent);border-color:var(--accent)}
.r-ic{font-size:28px}
.chat-search{border:1.5px solid var(--ink-b);border-radius:var(--r-md)}
:root[data-mode=dark] .chat-search{border-color:var(--line)}
.ch-count{display:inline-flex;gap:12px;align-items:baseline}
.sel-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;margin:10px 0 4px;padding:10px 12px;background:var(--card);border:1.5px solid var(--ink-b);border-radius:var(--r-md);box-shadow:var(--sh-1)}
:root[data-mode=dark] .sel-bar{border-color:var(--line)}
.sel-bar b{font-size:14px}
.sel-acts{display:flex;flex-wrap:wrap;gap:6px}
.sel-acts button{border:1.5px solid var(--ink-b);background:var(--card2);color:var(--text);border-radius:var(--r-sm);padding:6px 10px;font-weight:700;font-size:13px}
:root[data-mode=dark] .sel-acts button{border-color:var(--line)}
.sel-acts button.danger{background:var(--accent);color:#fff}
.sel-acts button:disabled{opacity:.4}
.sel-box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-b);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;background:var(--card)}
:root[data-mode=dark] .sel-box{border-color:var(--muted)}
.sel-box.on{background:var(--hi);color:var(--hi-ink)}
.convo.selected{outline:2px solid var(--accent);outline-offset:-2px}

ndicar links de pirataria. O NEXO n\xE3o hospeda v\xEDdeos nem mang\xE1s: o v\xEDdeo toca no YouTube e a leitura abre no site indicado. Quem cria a sala \xE9 respons\xE1vel pelo link. Salas e mensagens que violem isso podem ser removidas e as contas, suspensas. Denuncie pelo bot\xE3o da sala."],["6. Seu conte\xFAdo","Fotos, textos, \xE1udios e mensagens continuam sendo seus. Voc\xEA nos autoriza a guard\xE1-los e exibi-los dentro do app, para as pessoas que podem v\xEA-los, apenas para o app funcionar. Envie s\xF3 o que voc\xEA tem direito de enviar."],["7. Den\xFAncias, bloqueio e remo\xE7\xE3o","Voc\xEA pode denunciar e bloquear qualquer pessoa. Podemos analisar den\xFAncias, remover conte\xFAdos e suspender ou excluir contas que descumpram estes termos, com ou sem aviso, sobretudo em casos de risco para outras pessoas."],["8. Seguran\xE7a entre pessoas","O NEXO n\xE3o verifica a identidade de ningu\xE9m (o selo de verifica\xE7\xE3o ainda n\xE3o existe na vers\xE3o online). Tenha cuidado: n\xE3o envie dinheiro, senhas ou documentos, e avise algu\xE9m de confian\xE7a antes de encontrar uma pessoa que conheceu aqui. Em risco imediato, ligue 190."],["9. Sem garantias","O app \xE9 oferecido como est\xE1, sem garantia de funcionamento cont\xEDnuo. N\xE3o nos responsabilizamos por atitudes de outros usu\xE1rios, dentro dos limites da lei. Nada aqui retira direitos que a lei garante a voc\xEA."],["10. Encerrar a conta","Voc\xEA pode excluir sua conta quando quiser em Perfil \u2192 Excluir minha conta. Isso apaga seus dados do servidor (veja a Pol\xEDtica de Privacidade)."],["11. Mudan\xE7as e contato",`Podemos atualizar estes termos; se a mudan\xE7a for importante, avisaremos no app. D\xFAvidas ou pedidos: ${dg}. Lei aplic\xE1vel: a brasileira.`]],ST=[["1. Quem cuida dos seus dados",`O NEXO (projeto em fase de testes) \xE9 o respons\xE1vel pelos dados, nos termos da LGPD (Lei 13.709/2018). Contato para qualquer pedido sobre dados: ${dg}.`],["2. Quais dados guardamos","E-mail e senha da conta (a senha fica protegida e n\xE3o conseguimos ler). Dados do perfil que voc\xEA preenche: apelido, idade, cidade, bio, gostos, favoritos, perguntas e respostas, status, fotos e \xE1udio de apresenta\xE7\xE3o. Suas curtidas, bloqueios, den\xFAncias, as mensagens que voc\xEA troca com quem deu match com voc\xEA e as salas, mensagens e progresso de leitura que voc\xEA cria ou envia nas salas de assistir e ler (vis\xEDveis para quem est\xE1 na sala), e as fotos, legendas, curtidas e coment\xE1rios que voc\xEA publica no Momentos (vis\xEDveis para os outros usu\xE1rios)."],["3. Para que usamos","Para criar sua conta, mostrar seu perfil a outras pessoas, formar matches, permitir conversas, manter a seguran\xE7a (den\xFAncias e bloqueios) e fazer o app funcionar. N\xE3o vendemos seus dados, n\xE3o fazemos publicidade e n\xE3o criamos perfis para an\xFAncios."],["4. Quem v\xEA o qu\xEA","Seu perfil (apelido, idade, cidade, bio, gostos, fotos, \xE1udio) aparece no Explorar para outros usu\xE1rios, a menos que voc\xEA pause o perfil ou algu\xE9m bloqueie voc\xEA. Seu e-mail nunca aparece para outras pessoas. Suas mensagens s\xF3 s\xE3o vis\xEDveis para voc\xEA e para a outra pessoa da conversa. As mensagens n\xE3o t\xEAm criptografia de ponta a ponta: a equipe t\xE9cnica, com acesso ao banco de dados, poderia l\xEA-las em casos de seguran\xE7a ou exig\xEAncia legal."],["5. Onde ficam os dados","Em servi\xE7os de terceiros que prestam a infraestrutura: Supabase (banco de dados, login e arquivos; servidores no Brasil, regi\xE3o S\xE3o Paulo) e GitHub Pages (hospedagem do site). Eles tratam os dados s\xF3 para nos prestar o servi\xE7o."],["6. Por quanto tempo","Enquanto sua conta existir. Ao excluir a conta, apagamos seu perfil, fotos, \xE1udio, curtidas, bloqueios, den\xFAncias feitas por voc\xEA e mensagens. C\xF3pias de seguran\xE7a do provedor podem levar um tempo para desaparecer. Dados que a lei nos obrigue a guardar podem ser mantidos pelo prazo legal."],["7. Seus direitos",`Pela LGPD voc\xEA pode pedir confirma\xE7\xE3o de que tratamos seus dados, acesso, corre\xE7\xE3o, portabilidade, informa\xE7\xE3o sobre compartilhamento e a elimina\xE7\xE3o dos dados. Voc\xEA mesmo corrige o perfil no app e exclui a conta em Perfil \u2192 Excluir minha conta. Para os demais pedidos escreva para ${dg}.`],["8. Armazenamento no seu aparelho","O app guarda no seu navegador/aparelho a sess\xE3o de login e prefer\xEAncias (como tema, filtros e dicas j\xE1 vistas), e usa um servi\xE7o de instala\xE7\xE3o (PWA) para funcionar como app. O NEXO n\xE3o usa cookies de rastreamento nem ferramentas de an\xE1lise. Exce\xE7\xE3o: ao abrir uma sala de assistir junto, carregamos o player do YouTube (Google), que pode usar cookies e coletar dados segundo a pol\xEDtica do pr\xF3prio YouTube. Isso s\xF3 acontece quando voc\xEA abre uma sala desse tipo."],["9. Menores de idade","O NEXO \xE9 s\xF3 para maiores de 18 anos. Se soubermos que uma conta \xE9 de menor, ela ser\xE1 exclu\xEDda. Se voc\xEA souber de um caso, denuncie o perfil no app ou escreva para o contato acima."],["10. Seguran\xE7a e mudan\xE7as","Usamos regras de acesso no banco de dados para que cada pessoa s\xF3 veja o que pode ver, e conex\xE3o segura (HTTPS). Nenhum sistema \xE9 100% seguro. Se esta pol\xEDtica mudar de forma relevante, avisaremos no app."]];function Pc({initial:e="terms",onClose:t}){let[a,n]=(0,qu.useState)(e);return(0,Ze.jsx)("div",{className:"modal-bg",onClick:t,children:(0,Ze.jsxs)("div",{className:"modal rules-box legal",id:"legal-modal",role:"dialog","aria-label":"Termos e privacidade",onClick:o=>o.stopPropagation(),children:[(0,Ze.jsxs)("div",{className:"between",children:[(0,Ze.jsx)("h2",{style:{fontSize:22},children:a==="terms"?"Termos de uso":"Pol\xEDtica de privacidade"}),(0,Ze.jsx)("button",{className:"x2","aria-label":"Fechar",onClick:t,children:"\xD7"})]}),(0,Ze.jsxs)("div",{className:"seg",style:{marginBottom:8},children:[(0,Ze.jsx)("button",{typ
