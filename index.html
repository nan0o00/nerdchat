<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>NerdChat</title><meta name="description" content="Converse com gente que curte anime, games, RPG e rock. Grátis, 18+."><meta name="theme-color" content="#0b0716"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NerdChat"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta property="og:title" content="NerdChat"><meta property="og:description" content="Converse com gente que curte o mesmo que você. Grátis, 18+."><style>:root{--bg:#fafafa;--card:#ffffff;--card2:#efefef;--line:#dbdbdb;--text:#262626;--muted:#737373;--accent:#E1306C;--accent-d:#c9255d;--accent2:#E1306C;--accent-soft:rgba(225,48,108,.1);--ok:#059669;color-scheme:light}
*{box-sizing:border-box}html,body,#root{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 85% -8%,var(--accent-soft),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:background .25s,color .25s}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.muted{color:var(--muted)}.small-t{font-size:12px}
h2{margin:0 0 4px;font-size:28px;font-weight:900;letter-spacing:-.3px}h3{margin:24px 0 8px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none;object-fit:cover}

/* botões e chips */
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:8px 14px;margin:4px;font-weight:600;color:var(--text);transition:.15s}
.chip.small{padding:3px 10px;font-size:12px;margin:2px;cursor:default}.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff}
.chip:not(.small):hover{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent-d));border:0;color:#fff;font-weight:800;padding:12px 18px;border-radius:12px;margin-top:12px;box-shadow:0 6px 18px -8px var(--accent);transition:transform .12s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}.btn.full{width:100%}.btn.small{padding:8px 14px;margin:0 0 0 8px;font-size:14px}
.link{background:none;border:0;color:var(--accent);font-weight:700}

/* entrada e formulário */
.onboard{max-width:680px;margin:0 auto;padding:48px 24px}
.logo{font-size:44px;font-weight:900;margin:0 0 8px;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
label{display:block;font-weight:700;margin:20px 0 8px}
.check{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;margin:6px -4px 0}
.form{max-width:640px}
textarea,.form input:not([type=checkbox]),#msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--text)}
textarea,.form input:not([type=checkbox]){width:100%}textarea{resize:vertical;font-family:inherit;line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.form input::placeholder,textarea::placeholder,#msg::placeholder{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 110px;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inline{display:flex;gap:8px;align-items:center;margin-top:6px}.inline .btn{margin:0;white-space:nowrap}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--card);border:1px dashed var(--line)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.add{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;color:var(--accent);cursor:pointer}.slot.add small{font-size:12px;color:var(--muted)}
.main-tag{position:absolute;left:6px;bottom:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}
.rm{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:24px;padding:0}
.rm.static{position:static;flex:none;margin-left:auto}

/* estrutura */
.shell{display:flex;height:100%}
.tabs{width:240px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.brand{font-size:22px;font-weight:900;padding:6px 12px 18px;display:flex;align-items:center;gap:10px}
.logo-dot{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent)}
.tabs>button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:700;display:flex;gap:12px;align-items:center;transition:.15s}
.tabs>button em{font-style:normal}.tabs .ic{width:32px;height:32px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px}
.tabs>button:hover{background:var(--card2);color:var(--text)}
.tabs>button.active{background:var(--accent-soft);color:var(--text)}.tabs>button.active .ic{background:linear-gradient(135deg,var(--accent),var(--accent-d))}
.me-mini{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--card2);cursor:pointer}
.me-mini b{display:block;font-size:14px}.me-mini small{color:var(--muted)}
main{flex:1;overflow:auto;padding:30px;max-width:1120px}

/* cards, salas */
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.click{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}.click:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px -14px var(--accent)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.rcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.r-ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.grow{flex:1}.ct{font-weight:800;font-size:16px}
.online{color:var(--ok);font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px}.online i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.between{display:flex;justify-content:space-between;align-items:center}

/* perfis */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;margin-top:14px}.grid.one{grid-template-columns:minmax(310px,420px)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:box-shadow .2s}.pcard:hover{box-shadow:0 18px 40px -24px var(--accent)}
.hero{position:relative}.carousel{position:relative;aspect-ratio:4/5;background:#000}.carousel img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--card2),var(--bg))}
.shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(10,6,24,.92));pointer-events:none}
.hero-info{position:absolute;left:16px;bottom:14px;pointer-events:none;color:#fff}.h-name{font-size:26px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5)}.h-city{font-size:14px;color:#e5defa}
.badge{position:absolute;top:14px;right:14px;background:var(--accent2);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.bars{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:4px;pointer-events:none}.bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.bars span.on{background:#fff}
.nav{position:absolute;top:0;bottom:0;width:34%;border:0;background:transparent;color:transparent;font-size:36px;cursor:pointer}.nav.prev{left:0;text-align:left;padding-left:10px}.nav.next{right:0;text-align:right;padding-right:10px}.nav:hover{color:rgba(255,255,255,.7)}
.pbody{padding:14px 16px 18px}.bio{margin:0 0 12px;line-height:1.5}
.sec{margin-top:12px}.sec-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.favs{list-style:none;margin:0;padding:0;line-height:1.7;font-size:14px}.shared{margin:12px 0 0;font-size:13px;color:var(--muted)}.shared b{color:var(--text)}

/* chat */
.chat{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;position:relative}
.chat header{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.back{background:none;border:0;font-size:36px;line-height:30px;color:var(--text)}.title{font-size:18px;font-weight:800}
.msgs{flex:1;overflow:auto;padding:16px 14px}.row{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.row.mine{justify-content:flex-end}
.bubble{max-width:min(75%,460px);background:var(--card2);color:var(--text);padding:10px 12px 6px;border-radius:16px 16px 16px 4px;position:relative}
.bubble.me{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-radius:16px 16px 4px 16px}
.from{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;align-items:center}
.dots{background:none;border:0;color:var(--muted);padding:0 4px;font-size:16px}
.txt{line-height:1.4;word-break:break-word}.time{font-size:10px;opacity:.65;text-align:right;margin-top:3px}
.chat-img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:2px 0 6px;cursor:zoom-in}
.menu{position:absolute;top:100%;left:0;z-index:5;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}.menu button:hover{background:var(--card2)}.danger{color:#ef4444}
.typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:4px 0 8px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite}.typing i:nth-of-type(2){animation-delay:.18s}.typing i:nth-of-type(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ideas{margin:14px 0 6px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.idea{background:var(--card);border:1px dashed var(--accent);color:var(--text);border-radius:14px;padding:9px 14px;text-align:left;transition:.15s}.idea:hover{background:var(--accent-soft)}
.inputbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
#msg{flex:1;border-radius:22px;padding:12px 16px}
.send{margin:0;border-radius:22px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.mic{background:linear-gradient(135deg,var(--accent),var(--accent-d));border:0}
.recording{background:color-mix(in srgb,var(--accent2) 10%,transparent)}.rec-info{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--accent2);animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
.preview{display:flex;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--card)}.preview img{height:56px;width:56px;object-fit:cover;border-radius:10px}
.toast{background:var(--ok);color:#06251a;padding:8px 14px;margin:0 12px;border-radius:10px;font-weight:700;font-size:13px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}.lightbox img{max-width:92vw;max-height:90vh;border-radius:12px}
.lb-close{position:absolute;top:16px;right:20px;background:none;border:0;color:#fff;font-size:40px}

/* áudio */
.audio{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0 4px}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:13px;flex:none;display:flex;align-items:center;justify-content:center}
.bubble.me .play{background:#fff;color:var(--accent-d)}
.wave{flex:1;height:30px;display:flex;align-items:center;gap:2px}.wave span{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.3}.wave span.on{opacity:1}
.dur{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85;width:34px;text-align:right}

/* aparência */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:560px;margin-top:16px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .12s;box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}.sw:hover{transform:scale(1.1)}
.sw.sel{border-color:var(--text)}.sw.custom{position:relative;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);margin:0;overflow:hidden;cursor:pointer}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.sw.custom span{pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.seg{display:inline-flex;background:var(--card2);border-radius:14px;padding:4px;margin-top:6px}.seg button{border:0;background:none;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted)}.seg button.on{background:var(--accent);color:#fff}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin:6px 0 14px}.mini .row{animation:none}

@media(max-width:700px){
  .shell{flex-direction:column-reverse}.tabs{width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;gap:2px}
  .brand,.me-mini{display:none}.tabs>button{flex:1;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10px}.tabs .ic{background:none!important;width:auto;height:auto}
  main{padding:16px}.grid,.grid.one,.rooms{grid-template-columns:1fr}.three{grid-template-columns:1fr}
}

/* ---- novidades: reações, status, selos, eventos, stickers, verificação ---- */
select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;width:100%}
.inline select{width:auto;min-width:170px;flex:none}.inline input:disabled{opacity:.5}
.col{display:flex;flex-direction:column;min-width:0}.row.mine .col{align-items:flex-end}
.verified{vertical-align:-3px;flex:none}.h-row{display:flex;align-items:center;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.title-pill{background:var(--accent-soft);border:1px solid var(--accent);padding:3px 11px;border-radius:20px;font-size:12px;font-weight:800}
.mini-title{background:var(--accent-soft);padding:1px 8px;border-radius:10px;font-size:10px;font-weight:800;color:var(--text)}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);padding:3px 11px;border-radius:20px;font-size:12px}
.status-pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:3px}
.react-btn{background:none;border:0;opacity:0;font-size:13px;padding:0 2px;color:inherit;transition:opacity .15s}
.bubble:hover .react-btn,.react-btn:focus-visible{opacity:.8}.react-btn:hover{opacity:1}
@media(hover:none){.react-btn{opacity:.6}}
.picker{position:absolute;bottom:calc(100% + 4px);right:0;z-index:6;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px 6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.row:not(.mine) .picker{right:auto;left:0}
.picker button{background:none;border:0;font-size:22px;padding:3px 5px;border-radius:50%;transition:transform .12s}.picker button:hover{transform:scale(1.3)}
.rpills{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rpill{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:1px 8px;font-size:13px}.rpill.mine{border-color:var(--accent);background:var(--accent-soft)}
.bubble.bare{background:none!important;padding:0}.bubble.bare .meta{color:var(--muted)}
.sticker{display:block;width:140px;height:140px;margin:2px 0}
.spanel{border-top:1px solid var(--line);background:var(--card);padding:10px 14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px;max-height:190px;overflow:auto}
.sitem{background:none;border:1px solid transparent;border-radius:12px;padding:4px;transition:.12s}.sitem:hover{border-color:var(--accent);background:var(--accent-soft)}.sitem img{width:100%;display:block}
.icon-btn.active{border-color:var(--accent);background:var(--accent-soft)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}.banner em{font-style:normal;color:var(--muted)}.banner .btn{margin:0;flex:none}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.err{color:#ef4444;font-weight:700;font-size:14px;margin:8px 0 0}
.evform input,.evform textarea{width:100%}.evlist{display:grid;gap:14px}
.ev{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid hsl(var(--rh) 80% 55%);border-radius:18px;padding:14px;max-width:760px}
.ev-ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;background:linear-gradient(135deg,hsl(var(--rh) 85% 58%),hsl(calc(var(--rh) + 40) 80% 42%))}
.ev-top{display:flex;gap:10px;align-items:center;margin-bottom:2px}.ev-rel{background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.ev-desc{margin:6px 0;line-height:1.45}.ev-foot{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}.ev-foot .avatar{vertical-align:middle}.ev-count{margin-left:auto}.ev-foot .btn{margin:0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;opacity:.72}
.bd.done{opacity:1;border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}.bd.sel{box-shadow:0 0 0 2px var(--accent)}
.bd-ic{font-size:30px;filter:grayscale(1)}.bd.done .bd-ic{filter:none}.bd-name{font-weight:800}.bd-desc{font-size:12px;color:var(--muted);flex:1}
.prog{position:relative;height:16px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:6px}.prog div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-d))}.prog span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:16px}
.bd-btn{margin-top:8px;border:1px solid var(--accent);background:transparent;color:var(--text);border-radius:10px;padding:6px 8px;font-weight:700;font-size:12px}.bd-btn.on{background:var(--accent);color:#fff}
.locked{margin-top:8px;font-size:12px;color:var(--muted)}
.award{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;font-weight:800;padding:12px 22px;border-radius:30px;box-shadow:0 12px 36px rgba(0,0,0,.45);z-index:60;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.vbox{max-width:420px}.vbox.ok{border-color:#1d9bf0}

/* ===== termos / privacidade ===== */
.legal { max-height: 86vh; display: flex; flex-direction: column; }
.legal-body { overflow: auto; margin: 6px 0 12px; padding-right: 4px; flex: 1 1 auto; }
.legal-body h3 { font-size: 15px; margin: 14px 0 4px; }
.legal-body p { margin: 0; font-size: 14px; line-height: 1.5; opacity: .9; }
.legal-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.danger-zone { border-color: rgba(239,68,68,.45) !important; }
.btn.danger { background: #dc2626; color: #fff; }
.danger-text{color:#ef4444}

/* ===== salas de assistir / ler juntos ===== */
.wroom{display:flex;flex-direction:column;gap:10px}
.wplayer{position:relative}
.wframe{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.wframe iframe,.wframe>div{position:absolute;inset:0;width:100%;height:100%}
.wjoin{position:absolute;inset:0 0 auto 0;aspect-ratio:16/9;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;background:rgba(8,5,18,.82);border-radius:14px;padding:16px}
.wchat{display:flex;flex-direction:column;border:1px solid var(--line,rgba(255,255,255,.1));border-radius:14px;overflow:hidden}
.wmsgs{height:260px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.wm{position:relative;background:var(--card2);padding:8px 28px 8px 10px;border-radius:12px;max-width:92%;display:flex;flex-direction:column;gap:2px;word-break:break-word}
.wm.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff}
.wm b{font-size:12px;opacity:.85}.wm small{font-weight:400;opacity:.8}
.wflag{position:absolute;top:4px;right:6px;background:none;border:0;color:inherit;opacity:.5;cursor:pointer;font-size:13px}.wflag:hover{opacity:1}
.spoiler{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.3);color:inherit;border-radius:8px;padding:6px 8px;text-align:left;cursor:pointer;font-size:13px}
.wsend{display:flex;gap:8px;padding:8px;border-top:1px solid rgba(255,255,255,.08)}.wsend input{flex:1;min-width:0}
.mpanel{display:flex;flex-direction:column;gap:8px}
.mstep{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card2);padding:8px 10px;border-radius:12px}
.mstep .btn{margin-left:6px}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.wsend input{background:var(--card2);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font:inherit}
#m-open{text-decoration:none;white-space:normal;text-align:center;display:block}

/* ===== recibos e avisos ===== */
.tick{font-size:12px;letter-spacing:-2px;opacity:.75;margin-left:2px}
.tick.read{color:#38bdf8;opacity:1;font-weight:700}
.notif-item{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}
.notif-item.new b{color:var(--accent)}
.notif-item small{opacity:.6;white-space:nowrap}

/* perfil completo (modal) */
.pm-bg{align-items:flex-start;overflow:auto;padding:0;z-index:80;background:var(--card)}
.pm{position:relative;width:100%;max-width:520px;margin:0 auto;background:var(--card);min-height:100%;padding:12px 12px 90px}
.pm .pcard{margin:0}
.pm-x{position:sticky;top:6px;float:right;z-index:5;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:26px;line-height:1}
.pm-photos{margin-top:14px}
.pm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pm-th{padding:0;border:0;background:none;aspect-ratio:1;border-radius:10px;overflow:hidden}
.pm-th img{width:100%;height:100%;object-fit:cover;display:block}
.pm-actions{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:28px;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:6}
.pm-big{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:flex;align-items:center;justify-content:center}
.pm-big img{max-width:100%;max-height:100%;object-fit:contain}
.sheet-photos{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px}
.sheet-photos img{height:150px;width:auto;border-radius:12px;flex:none}
.prof-btn{background:none;border:0;padding:0;border-radius:50%}
.lcard{cursor:pointer}


/* ===== visual limpo (estilo Instagram/Facebook): sem brilhos nem degradês ===== */
body{background:var(--bg)}
.landing::before{display:none}
.btn,.chip.on,.mic,.award,.install-banner,.hc-badge,.bubble.me,.wm.me,.prog div,.st-bar i,.tabs>button.active .ic,.rb.like,.logo-dot{background:var(--accent)!important;box-shadow:none!important}
.btn:hover{filter:brightness(.94)}
.btn{border-radius:10px;font-weight:700}
.btn.ghost{background:transparent!important;color:var(--text);border:1px solid var(--line)}
.logo,.match-title{background:none!important;-webkit-background-clip:initial;background-clip:initial;color:var(--text)!important}
.match-title{color:var(--accent)!important}
.ev-ic{background:var(--card2)!important}
.tabs>button.active{background:var(--accent-soft)}
.shade,.hc::after,.lcard::after{background:linear-gradient(transparent,rgba(0,0,0,.65))}
.pcard,.card,.rcard,.modal,.auth-card{box-shadow:0 1px 2px rgba(0,0,0,.06)}
.modal-bg,.match-bg{background:rgba(0,0,0,.55)}
.confetti{display:none}
.chip{background:var(--card2);color:var(--text)}
.chip.on{color:#fff}
.rb.pass{color:#737373;box-shadow:inset 0 0 0 2px #dbdbdb!important;background:var(--card)}
.rb.like{color:#fff}
.stamp.like{color:#22c55e;border-color:#22c55e}
.stamp.pass{color:#ef4444;border-color:#ef4444}

.r-ic:empty{display:none}
.scard{box-shadow:0 2px 12px rgba(0,0,0,.18)!important}
.logo-mark{filter:none!important}
.tabs>button .ic{background:none!important;color:var(--muted)}
.tabs>button.active .ic{background:none!important;color:var(--accent)}
.tabs>button.active{background:transparent;color:var(--text)}
.tab-badge{background:#ff3040;color:#fff}
.feats li>div b{display:block}
.chip{border-color:transparent}
.lcard,.pcard,.card{border-color:var(--line)}
.r-ic{background:var(--card2)!important;box-shadow:none!important}
.online i{box-shadow:none}

.topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:var(--bg);margin:-4px 0 6px;padding:6px 0}
.tb-brand{font-weight:800;font-size:22px;letter-spacing:-.5px}
.bell{position:relative;background:none;border:0;color:var(--text);padding:6px;border-radius:50%;display:flex}
.bell.on{color:var(--accent)}
.bell .tab-badge{position:absolute;top:0;right:-2px}
@media(min-width:861px){.topbar{display:flex}}

.set-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;color:var(--text);font-weight:700;text-align:left;margin-top:8px}
.set-row small{margin-left:auto;font-weight:500}.set-row i{font-style:normal;font-size:22px;color:var(--muted)}

.ban-banner{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.mod-card{align-items:flex-start}

/* ---- chat limpo (estilo Instagram) + teclado ---- */
.chat{position:fixed;top:0;left:0;right:0;height:var(--vvh,100dvh);width:100%;background:var(--bg);z-index:5}
.chat header{padding:10px 14px;gap:10px;background:var(--bg)}
.msgs{padding:12px 12px 8px;background:var(--bg);overscroll-behavior:contain}
.row{margin-bottom:8px;gap:8px}
.row.join-next{margin-bottom:2px}
.av-gap{width:34px;flex:none}
.bubble{padding:9px 14px 6px;border-radius:20px;font-size:15px}
.bubble.me{border-radius:20px}
.row.mine.join-prev .bubble.me{border-top-right-radius:6px}.row.mine.join-next .bubble.me{border-bottom-right-radius:6px}
.row:not(.mine).join-prev .bubble{border-top-left-radius:6px}.row:not(.mine).join-next .bubble{border-bottom-left-radius:6px}
.row.mine:not(.join-next) .bubble.me{border-bottom-right-radius:20px}.row:not(.mine):not(.join-next) .bubble{border-bottom-left-radius:20px}
.row{animation:none}
.day-sep{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 10px}
.meta{margin-top:1px}.time{font-size:10px}
.chat.dm .from{position:absolute;top:2px;right:-30px;margin:0}.chat.dm .from>span,.chat.dm .from>svg{display:none}
.chat.dm .row.mine .from{display:none}
.chat.dm .dots{opacity:.45;font-size:18px;padding:0 6px}
.inputbar{padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:0;background:var(--bg);gap:8px}
#msg{background:var(--card2);border:0;border-radius:24px;padding:11px 16px}
.inputbar .send{background:none!important;color:var(--accent);padding:0 6px;font-weight:700;border:0}
.icon-btn{border:0;background:var(--card2)}

/* ---- mídia, emojis e tema da conversa ---- */
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:8px;max-height:180px;overflow:auto}
.eitem{background:none;border:0;font-size:24px;padding:6px 0;border-radius:8px}.eitem:active,.eitem:hover{background:var(--card2)}
.media-ph{min-width:160px;padding:18px 8px;text-align:center;font-size:13px;opacity:.75}
.file-chip{display:flex;align-items:center;gap:10px;background:rgba(127,127,127,.15);border:0;border-radius:14px;padding:8px 10px;color:inherit;text-align:left;min-width:200px;max-width:100%}
.file-ic{width:38px;height:38px;border-radius:10px;background:rgba(127,127,127,.25);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.file-info{display:flex;flex-direction:column;min-width:0}.file-info b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-info small{opacity:.75;font-size:11px}
.icon-btn svg{display:block}.icon-btn.active{background:var(--accent-soft)}
.ghost-ic{margin-left:auto;background:none!important;border:0}
.inputbar{gap:6px}.inputbar .icon-btn{width:38px;height:38px}
.theme-sheet{padding:12px 16px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.chat .bubble.me{background:var(--bubble-me,var(--accent))!important}
.chat .bubble.me .play{color:var(--bubble-me,var(--accent))}
.chat.bg-tingido .msgs{background:color-mix(in srgb,var(--bubble-me,var(--accent)) 9%,var(--bg))}
.chat.bg-degrade .msgs{background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bubble-me,var(--accent)) 22%,var(--bg)))}
.chat .inputbar .icon-btn.mic{background:var(--card2)!important;color:var(--text)}

/* ---- Momentos ---- */
.compose-bar{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;margin:12px 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--muted);text-align:left;font-size:15px}
.compose-bar:hover{border-color:var(--accent)}
.qcard{max-width:560px;display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 6px}
.qcard small{color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}.qcard b{font-size:16px;line-height:1.3}.qcard .link{align-self:flex-start;color:var(--accent);font-weight:700;background:none;border:0;padding:4px 0 0}
.cp-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.composer textarea{width:100%}
.cp-tools{display:flex;gap:8px;margin:8px 0}.cp-tool{background:var(--card2);border:0;border-radius:999px;padding:9px 16px;font-weight:700;color:var(--text)}
.cp-prev video{width:100%;max-height:340px;border-radius:16px;background:#000;display:block}
.ptext{margin:6px 18px 10px;font-size:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.pvid{line-height:0}.pvid video{width:100%;max-height:520px;display:block;background:#000}

/* ---- Descobrir novo ---- */
.d-head h2{font-size:30px;margin:0}
.d-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:12px -2px 8px;padding:0 2px}
.d-tabs::-webkit-scrollbar{display:none}
.d-tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.d-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.d-tabs .n{background:var(--card2);color:var(--muted);border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.d-tabs .n.hot{background:var(--accent);color:#fff}
.d-sum{margin:0 0 12px}
.likes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.account-end{display:flex;justify-content:center;margin:18px 0 28px}
.d-tabs{gap:0;justify-content:space-between}
.d-tabs button{padding:10px 8px 9px;font-size:13px;gap:4px}

/* barra do topo: cobre toda a largura e não deixa o conteúdo aparecer por cima */
main{--mp:30px}
@media(max-width:700px){main{--mp:16px}}
.topbar{top:calc(-1 * var(--mp));margin:calc(-1 * var(--mp)) calc(-1 * var(--mp)) 8px;padding:calc(var(--mp) * .6) var(--mp) 8px;background:var(--bg);z-index:30}
.icat{margin:10px 0 4px}.icat-t{margin:0 0 6px;font-size:13px;font-weight:700;opacity:.8;letter-spacing:.2px}
.shared-n{margin:6px 0 2px;font-size:13px;opacity:.9}
.match-pct{font-weight:700;margin:6px 0 10px}
.more-sheet{position:absolute;top:58px;right:10px;z-index:30;display:flex;flex-direction:column;min-width:200px;background:var(--card,#1b1b2b);border:1px solid var(--line,#ffffff22);border-radius:14px;box-shadow:0 10px 30px #0006;overflow:hidden}
.more-sheet button{background:none;border:0;color:inherit;text-align:left;padding:13px 16px;font-size:15px;cursor:pointer}
.more-sheet button:hover{background:#ffffff12}.more-sheet .danger{color:#ef4444}
.sc-info{pointer-events:none}.sc-info .more,.sc-info button,.sc-info .chip{pointer-events:auto}

forma\xE7\xF5es do seu perfil s\xE3o verdadeiras. Contas de menores de 18 anos ser\xE3o removidas assim que forem identificadas."],["3. Sua conta","Voc\xEA \xE9 respons\xE1vel pela sua senha e por tudo o que \xE9 feito na sua conta. Avise-nos se achar que algu\xE9m entrou nela. Cada pessoa pode ter uma conta."],["4. Regras de conviv\xEAncia","Voc\xEA concorda em seguir as regras de conviv\xEAncia do app: respeito, nada de ass\xE9dio, conte\xFAdo sexual expl\xEDcito, viol\xEAncia gr\xE1fica, ilegalidade, perfis falsos, golpes, spam, pedidos de dinheiro ou de dados pessoais. Tamb\xE9m n\xE3o pode divulgar fotos, conversas ou dados de outras pessoas sem permiss\xE3o."],["5. Salas de assistir e ler","Nas salas de assistir junto e de leitura, s\xF3 \xE9 permitido usar conte\xFAdo de fonte oficial ou autorizado pelos detentores dos direitos autorais (por exemplo, canais oficiais no YouTube e leituras gratuitas oficiais). \xC9 proibido indicar links de pirataria. O NerdChat n\xE3o hospeda v\xEDdeos nem mang\xE1s: o v\xEDdeo toca no YouTube e a leitura abre no site indicado. Quem cria a sala \xE9 respons\xE1vel pelo link. Salas e mensagens que violem isso podem ser removidas e as contas, suspensas. Denuncie pelo bot\xE3o da sala."],["6. Seu conte\xFAdo","Fotos, textos, \xE1udios e mensagens continuam sendo seus. Voc\xEA nos autoriza a guard\xE1-los e exibi-los dentro do app, para as pessoas que podem v\xEA-los, apenas para o app funcionar. Envie s\xF3 o que voc\xEA tem direito de enviar."],["7. Den\xFAncias, bloqueio e remo\xE7\xE3o","Voc\xEA pode denunciar e bloquear qualquer pessoa. Podemos analisar den\xFAncias, remover conte\xFAdos e suspender ou excluir contas que descumpram estes termos, com ou sem aviso, sobretudo em casos de risco para outras pessoas."],["8. Seguran\xE7a entre pessoas","O NerdChat n\xE3o verifica a identidade de ningu\xE9m (o selo de verifica\xE7\xE3o ainda n\xE3o existe na vers\xE3o online). Tenha cuidado: n\xE3o envie dinheiro, senhas ou documentos, e avise algu\xE9m de confian\xE7a antes de encontrar uma pessoa que conheceu aqui. Em risco imediato, ligue 190."],["9. Sem garantias","O app \xE9 oferecido como est\xE1, sem garantia de funcionamento cont\xEDnuo. N\xE3o nos responsabilizamos por atitudes de outros usu\xE1rios, dentro dos limites da lei. Nada aqui retira direitos que a lei garante a voc\xEA."],["10. Encerrar a conta","Voc\xEA pode excluir sua conta quando quiser em Perfil \u2192 Excluir minha conta. Isso apaga seus dados do servidor (veja a Pol\xEDtica de Privacidade)."],["11. Mudan\xE7as e contato",`Podemos atualizar estes termos; se a mudan\xE7a for importante, avisaremos no app. D\xFAvidas ou pedidos: ${Ff}. Lei aplic\xE1vel: a brasileira.`]],zN=[["1. Quem cuida dos seus dados",`O NerdChat (projeto em fase de testes) \xE9 o respons\xE1vel pelos dados, nos termos da LGPD (Lei 13.709/2018). Contato para qualquer pedido sobre dados: ${Ff}.`],["2. Quais dados guardamos","E-mail e senha da conta (a senha fica protegida e n\xE3o conseguimos ler). Dados do perfil que voc\xEA preenche: apelido, idade, cidade, bio, gostos, favoritos, perguntas e respostas, status, fotos e \xE1udio de apresenta\xE7\xE3o. Suas curtidas, bloqueios, den\xFAncias, as mensagens que voc\xEA troca com quem deu match com voc\xEA e as salas, mensagens e progresso de leitura que voc\xEA cria ou envia nas salas de assistir e ler (vis\xEDveis para quem est\xE1 na sala), e as fotos, legendas, curtidas e coment\xE1rios que voc\xEA publica no Momentos (vis\xEDveis para os outros usu\xE1rios)."],["3. Para que usamos","Para criar sua conta, mostrar seu perfil a outras pessoas, formar matches, permitir conversas, manter a seguran\xE7a (den\xFAncias e bloqueios) e fazer o app funcionar. N\xE3o vendemos seus dados, n\xE3o fazemos publicidade e n\xE3o criamos perfis para an\xFAncios."],["4. Quem v\xEA o qu\xEA","Seu perfil (apelido, idade, cidade, bio, gostos, fotos, \xE1udio) aparece no Descobrir para outros usu\xE1rios, a menos que voc\xEA pause o perfil ou algu\xE9m bloqueie voc\xEA. Seu e-mail nunca aparece para outras pessoas. Suas mensagens s\xF3 s\xE3o vis\xEDveis para voc\xEA e para a outra pessoa da conversa. As mensagens n\xE3o t\xEAm criptografia de ponta a ponta: a equipe t\xE9cnica, com acesso ao banco de dados, poderia l\xEA-las em casos de seguran\xE7a ou exig\xEAncia legal."],["5. Onde ficam os dados","Em servi\xE7os de terceiros que prestam a infraestrutura: Supabase (banco de dados, login e arquivos; servidores no Brasil, regi\xE3o S\xE3o Paulo) e GitHub Pages (hospedagem do site). Eles tratam os dados s\xF3 para nos prestar o servi\xE7o."],["6. Por quanto tempo","Enquanto sua conta existir. Ao excluir a conta, apagamos seu perfil, fotos, \xE1udio, curtidas, bloqueios, den\xFAncias feitas por voc\xEA e mensagens. C\xF3pias de seguran\xE7a do provedor podem levar um tempo para desaparecer. Dados que a lei nos obrigue a guardar podem ser mantidos pelo prazo legal."],["7. Seus direitos",`Pela LGPD voc\xEA pode pedir confirma\xE7\xE3o de que tratamos seus dados, acesso, corre\xE7\xE3o, portabilidade, informa\xE7\xE3o sobre compartilhamento e a elimina\xE7\xE3o dos dados. Voc\xEA mesmo corrige o perfil no app e exclui a conta em Perfil \u2192 Excluir minha conta. Para os demais pedidos escreva para ${Ff}.`],["8. Armazenamento no seu aparelho","O app guarda no seu navegador/aparelho a sess\xE3o de login e prefer\xEAncias (como tema, filtros e dicas j\xE1 vistas), e usa um servi\xE7o de instala\xE7\xE3o (PWA) para funcionar como app. O NerdChat n\xE3o usa cookies de rastreamento nem ferramentas de an\xE1lise. Exce\xE7\xE3o: ao abrir uma sala de assistir junto, carregamos o player do YouTube (Google), que pode usar cookies e coletar dados segundo a pol\xEDtica do pr\xF3prio YouTube. Isso s\xF3 acontece quando voc\xEA abre uma sala desse tipo."],["9. Menores de idade","O NerdChat \xE9 s\xF3 para maiores de 18 anos. Se soubermos que uma conta \xE9 de menor, ela ser\xE1 exclu\xEDda. Se voc\xEA
