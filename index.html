go estiver errado, use denunciar ou bloquear nos tr\xEAs pontinhos (\u22EF) de cada perfil ou mensagem."}),(0,xt.jsx)("button",{className:"btn full",id:"rules-close",onClick:e,children:"Entendi"})]})})}var Rs=I(Je()),xe=I(he()),wf="fa2233710@gmail.com",z3="05/10/2026",O3=[["1. O que \xE9 o NEXO","O NEXO \xE9 um aplicativo gratuito para maiores de 18 anos conhecerem pessoas que gostam de anime, games, RPG, rock e assuntos parecidos. Ele est\xE1 em fase de testes: podem existir erros, e o servi\xE7o pode mudar ou ser interrompido."],["2. Quem pode usar","S\xF3 pode usar quem tem 18 anos ou mais. Ao criar a conta voc\xEA declara que tem idade suficiente e que as informa\xE7\xF5es do seu perfil s\xE3o verdadeiras. Contas de menores de 18 anos ser\xE3o removidas assim que forem identificadas."],["3. Sua conta","Voc\xEA \xE9 respons\xE1vel pela sua senha e por tudo o que \xE9 feito na sua conta. Avise-nos se achar que algu\xE9m entrou nela. Cada pessoa pode ter uma conta."],["4. Regras de conviv\xEAncia","Voc\xEA concorda em seguir as regras de conviv\xEAncia do app: respeito, nada de ass\xE9dio, conte\xFAdo sexual expl\xEDcito, viol\xEAncia gr\xE1fica, ilegalidade, perfis falsos, golpes, spam, pedidos de dinheiro ou de dados pessoais. Tamb\xE9m n\xE3o pode divulgar fotos, conversas ou dados de outras pessoas sem permiss\xE3o."],["5. Salas de assistir e ler","Nas salas de assistir junto e de leitura, s\xF3 \xE9 permitido usar conte\xFAdo de fonte oficial ou autorizado pelos detentores dos direitos autorais (por exemplo, canais oficiais no YouTube e leituras gratuitas oficiais). \xC9 proibido indicar links de pirataria. O NEXO n\xE3o hospeda v\xEDdeos nem mang\xE1s: o v\xEDdeo toca no YouTube e a leitura abre no site indicado. Quem cria a sala \xE9 respons\xE1vel pelo link. Salas e mensagens que violem isso podem ser removidas e as contas, suspensas. Denuncie pelo bot\xE3o da sala."],["6. Seu conte\xFAdo","Fotos, textos, \xE1udios e mensagens continuam sendo seus. Voc\xEA nos autoriza a guard\xE1-los e exibi-los dentro do app, para as pessoas que podem v\xEA-los, apenas para o app funcionar. Envie s\xF3 o que voc\xEA tem direito de enviar."],["7. Den\xFAncias, bloqueio e remo\xE7\xE3o","Voc\xEA pode denunciar e bloquear qualquer pessoa. Podemos analisar den\xFAncias, remover conte\xFAdos e suspender ou excluir contas que descumpram estes termos, com ou sem aviso, sobretudo em casos de risco para outras pessoas."],["8. Seguran\xE7a entre pessoas","O NEXO n\xE3o verifica a identidade de ningu\xE9m (o selo de verifica\xE7\xE3o ainda n\xE3o existe na vers\xE3o online). Tenha cuidado: n\xE3o envie dinheiro, senhas ou documentos, e avise algu\xE9m de confian\xE7a antes de encontrar uma pessoa que conheceu aqui. Em risco imediato, ligue 190."],["9. Sem garantias","O app \xE9 oferecido como est\xE1, sem garantia de funcionamento cont\xEDnuo. N\xE3o nos responsabilizamos por atitudes de outros usu\xE1rios, dentro dos limites da lei. Nada aqui retira direitos que a lei garante a voc\xEA."],["10. Encerrar a conta","Voc\xEA pode excluir sua conta quando quiser em Perfil \u2192 Excluir minha conta. Isso apaga seus dados do servidor (veja a Pol\xEDtica de Privacidade)."],["11. Mudan\xE7as e contato",`Podemos atualizar estes termos; se a mudan\xE7a for importante, avisaremos no app. D\xFAvidas ou pedidos: ${wf}. Lei aplic\xE1vel: a brasileira.`]],q3=[["1. Quem cuida dos seus dados",`O NEXO (projeto em fase de testes) \xE9 o respons\xE1vel pelos dados, nos termos da LGPD (Lei 13.709/2018). Contato para qualquer pedido sobre dados: ${wf}.`],["2. Quais dados guardamos","E-mail e senha da conta (a senha fica protegida e n\xE3o conseguimos ler). Dados do perfil que voc\xEA preenche: apelido, idade, cidade, bio, gostos, favoritos, perguntas e respostas, status, fotos e \xE1udio de apresenta\xE7\xE3o. Suas curtidas, bloqueios, den\xFAncias, as mensagens que voc\xEA troca com quem deu match com voc\xEA e as salas, mensagens e progresso de leitura que voc\xEA cria ou envia nas salas de assistir e ler (vis\xEDveis para quem est\xE1 na sala), e as fotos, legendas, curtidas e coment\xE1rios que voc\xEA publica no Momentos (vis\xEDveis para os outros usu\xE1rios)."],["3. Para que usamos","Para criar sua conta, mostrar seu perfil a outras pessoas, formar matches, permitir conversas, manter a seguran\xE7a (den\xFAncias e bloqueios) e fazer o app funcionar. N\xE3o vendemos seus dados, n\xE3o fazemos publicidade e n\xE3o criamos perfis para an\xFAncios."],["4. Quem v\xEA o qu\xEA","Seu perfil (apelido, idade, cidade, bio, gostos, fotos, \xE1udio) aparece no Explorar para outros usu\xE1rios, a menos que voc\xEA pause o perfil ou algu\xE9m bloqueie voc\xEA. Seu e-mail nunca aparece para outras pessoas. Suas mensagens s\xF3 s\xE3o vis\xEDveis para voc\xEA e para a outra pessoa da conversa. As mensagens n\xE3o t\xEAm criptografia de ponta a ponta: a equipe t\xE9cnica, com acesso ao banco de dados, poderia l\xEA-las em casos de seguran\xE7a ou exig\xEAncia legal."],["5. Onde ficam os dados","Em servi\xE7os de terceiros que prestam a infraestrutura: Supabase (banco de dados, login e arquivos; servidores no Brasil, regi\xE3o S\xE3o Paulo) e GitHub Pages (hospedagem do site). Eles tratam os dados s\xF3 para nos prestar o servi\xE7o."],["6. Por quanto tempo","Enquanto sua conta existir. Ao excluir a conta, apagamos seu perfil, fotos, \xE1udio, curtidas, bloqueios, den\xFAncias feitas por voc\xEA e mensagens. C\xF3pias de seguran\xE7a do provedor podem levar um tempo para desaparecer. Dados que a lei nos obrigue a guardar podem ser mantidos pelo prazo legal."],["7. Seus direitos",`Pela LGPD voc\xEA pode pedir confirma\xE7\xE3o de que tratamos seus dados, acesso, corre\xE7\xE3o, portabilidade, informa\xE7\xE3o sobre compartilhamento e a elimina\xE7\xE3o dos dados. Voc\xEA mesmo corrige o perfil no app e exclui a conta em Perfil \u2192 Excluir minha conta. Para os demais pedidos escreva para ${wf}.`],["8. Armazenamento no seu aparelho","O app guarda no seu navegador/aparelho a sess\xE3o de login e prefer\xEAncias (como tema, filtros e dicas j\xE1 vistas), e usa um servi\xE7o de instala\xE7\xE3o (PWA) para funcionar como app. O NEXO n\xE3o usa cookies de rastreamento nem ferramentas de an\xE1lise. Exce\xE7\xE3o: ao abrir uma sala de assistir junto, carregamos o player do YouTube (Google), que pode usar cookies e coletar dados segundo a pol\xEDtica do pr\xF3prio YouTube. Isso s\xF3 acontece quando voc\xEA abre uma sala desse tipo."],["9. Menores de idade","O NEXO \xE9 s\xF3 para maiores de 18 anos. Se soubermos que uma conta \xE9 de menor, ela ser\xE1 exclu\xEDda. Se voc\xEA souber de um caso, denuncie o perfil no app ou escreva para o contato acima."],["10. Seguran\xE7a e mudan\xE7as","Usamos regras de acesso no banco de dados para que cada pessoa s\xF3 veja o que pode ver, e conex\xE3o segura (HTTPS). Nenhum sistema \xE9 100% seguro. Se esta pol\xEDtica mudar de forma relevante, avisaremos no app."]];function lo({initial:e="terms",onClose:t}){let[a,l]=(0,Rs.useState)(e);return(0,xe.jsx)("div",{className:"modal-bg",onClick:t,children:(0,xe.jsxs)("div",{className:"modal rules-box legal",id:"legal-modal",role:"dialog","aria-label":"Termos e privacidade",onClick:i=>i.stopPropagation(),children:[(0,xe.jsxs)("div",{className:"between",children:[(0,xe.jsx)("h2",{style:{fontSize:22},children:a==="terms"?"Termos de uso":"Pol\xEDtica de privacidade"}),(0,xe.jsx)("button",{className:"x2","aria-label":"Fechar",onClick:t,children:"\xD7"})]}),(0,xe.jsxs)("div",{className:"seg",style:{marginBottom:8},children:[(0,xe.jsx)("button",{type:"button",id:"legal-terms",className:a==="terms"?"on":"",onClick:()=>l("terms"),children:"Termos"}),(0,xe.jsx)("button",{type:"button",id:"legal-privacy",className:a==="privacy"?"on":"",onClick:()=>l("privacy"),children:"Privacidade"})]}),(0,xe.jsxs)("p",{className:"muted small-t",children:["Vers\xE3o de ",z3," \xB7 linguagem simples, sem pegadinha."]}),(0,xe.jsx)("div",{className:"
