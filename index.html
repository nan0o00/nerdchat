<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>NEXO</title><meta name="description" content="NEXO: encontre sua galera. Anime, games, RPG e rock. Grátis, 18+."><meta name="theme-color" content="#0b0716"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NEXO"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta property="og:title" content="NEXO"><meta property="og:description" content="Encontre sua galera. Grátis, 18+."><style>:root{--bg:#fafafa;--card:#ffffff;--card2:#efefef;--line:#dbdbdb;--text:#262626;--muted:#737373;--accent:#E1306C;--accent-d:#c9255d;--accent2:#E1306C;--accent-soft:rgba(225,48,108,.1);--ok:#059669;color-scheme:light}
*{box-sizing:border-box}html,body,#root{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 85% -8%,var(--accent-soft),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:background .25s,color .25s}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.muted{color:var(--muted)}.small-t{font-size:12px}
h2{margin:0 0 4px;font-size:28px;font-weight:900;letter-spacing:-.3px}h3{margin:24px 0 8px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none;object-fit:cover}

/* botões e chips */
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:8px 14px;margin:4px;font-weight:600;color:var(--text);transition:.15s}
.chip.small{padding:3px 10px;font-size:12px;margin:2px;cursor:default}.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff}
.chip:not(.small):hover{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent-d));border:0;color:#fff;font-weight:800;padding:12px 18px;border-radius:12px;margin-top:12px;box-shadow:0 6px 18px -8px var(--accent);transition:transform .12s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}.btn.full{width:100%}.btn.small{padding:8px 14px;margin:0 0 0 8px;font-size:14px}
.link{background:none;border:0;color:var(--accent);font-weight:700}

/* entrada e formulário */
.onboard{max-width:680px;margin:0 auto;padding:48px 24px}
.logo{font-size:44px;font-weight:900;margin:0 0 8px;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
label{display:block;font-weight:700;margin:20px 0 8px}
.check{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;margin:6px -4px 0}
.form{max-width:640px}
textarea,.form input:not([type=checkbox]),#msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--text)}
textarea,.form input:not([type=checkbox]){width:100%}textarea{resize:vertical;font-family:inherit;line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.form input::placeholder,textarea::placeholder,#msg::placeholder{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 110px;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inline{display:flex;gap:8px;align-items:center;margin-top:6px}.inline .btn{margin:0;white-space:nowrap}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--card);border:1px dashed var(--line)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.add{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;color:var(--accent);cursor:pointer}.slot.add small{font-size:12px;color:var(--muted)}
.main-tag{position:absolute;left:6px;bottom:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}
.rm{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:24px;padding:0}
.rm.static{position:static;flex:none;margin-left:auto}

/* estrutura */
.shell{display:flex;height:100%}
.tabs{width:240px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.brand{font-size:22px;font-weight:900;padding:6px 12px 18px;display:flex;align-items:center;gap:10px}
.logo-dot{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent)}
.tabs>button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:700;display:flex;gap:12px;align-items:center;transition:.15s}
.tabs>button em{font-style:normal}.tabs .ic{width:32px;height:32px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px}
.tabs>button:hover{background:var(--card2);color:var(--text)}
.tabs>button.active{background:var(--accent-soft);color:var(--text)}.tabs>button.active .ic{background:linear-gradient(135deg,var(--accent),var(--accent-d))}
.me-mini{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--card2);cursor:pointer}
.me-mini b{display:block;font-size:14px}.me-mini small{color:var(--muted)}
main{flex:1;overflow:auto;padding:30px;max-width:1120px}

/* cards, salas */
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.click{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}.click:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px -14px var(--accent)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.rcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.r-ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.grow{flex:1}.ct{font-weight:800;font-size:16px}
.online{color:var(--ok);font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px}.online i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.between{display:flex;justify-content:space-between;align-items:center}

/* perfis */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;margin-top:14px}.grid.one{grid-template-columns:minmax(310px,420px)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:box-shadow .2s}.pcard:hover{box-shadow:0 18px 40px -24px var(--accent)}
.hero{position:relative}.carousel{position:relative;aspect-ratio:4/5;background:#000}.carousel img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--card2),var(--bg))}
.shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(10,6,24,.92));pointer-events:none}
.hero-info{position:absolute;left:16px;bottom:14px;pointer-events:none;color:#fff}.h-name{font-size:26px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5)}.h-city{font-size:14px;color:#e5defa}
.badge{position:absolute;top:14px;right:14px;background:var(--accent2);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.bars{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:4px;pointer-events:none}.bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.bars span.on{background:#fff}
.nav{position:absolute;top:0;bottom:0;width:34%;border:0;background:transparent;color:transparent;font-size:36px;cursor:pointer}.nav.prev{left:0;text-align:left;padding-left:10px}.nav.next{right:0;text-align:right;padding-right:10px}.nav:hover{color:rgba(255,255,255,.7)}
.pbody{padding:14px 16px 18px}.bio{margin:0 0 12px;line-height:1.5}
.sec{margin-top:12px}.sec-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.favs{list-style:none;margin:0;padding:0;line-height:1.7;font-size:14px}.shared{margin:12px 0 0;font-size:13px;color:var(--muted)}.shared b{color:var(--text)}

/* chat */
.chat{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;position:relative}
.chat header{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.back{background:none;border:0;font-size:36px;line-height:30px;color:var(--text)}.title{font-size:18px;font-weight:800}
.msgs{flex:1;overflow:auto;padding:16px 14px}.row{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.row.mine{justify-content:flex-end}
.bubble{max-width:min(75%,460px);background:var(--card2);color:var(--text);padding:10px 12px 6px;border-radius:16px 16px 16px 4px;position:relative}
.bubble.me{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-radius:16px 16px 4px 16px}
.from{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;align-items:center}
.dots{background:none;border:0;color:var(--muted);padding:0 4px;font-size:16px}
.txt{line-height:1.4;word-break:break-word}.time{font-size:10px;opacity:.65;text-align:right;margin-top:3px}
.chat-img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:2px 0 6px;cursor:zoom-in}
.menu{position:absolute;top:100%;left:0;z-index:5;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}.menu button:hover{background:var(--card2)}.danger{color:#ef4444}
.typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:4px 0 8px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite}.typing i:nth-of-type(2){animation-delay:.18s}.typing i:nth-of-type(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ideas{margin:14px 0 6px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.idea{background:var(--card);border:1px dashed var(--accent);color:var(--text);border-radius:14px;padding:9px 14px;text-align:left;transition:.15s}.idea:hover{background:var(--accent-soft)}
.inputbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
#msg{flex:1;border-radius:22px;padding:12px 16px}
.send{margin:0;border-radius:22px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.mic{background:linear-gradient(135deg,var(--accent),var(--accent-d));border:0}
.recording{background:color-mix(in srgb,var(--accent2) 10%,transparent)}.rec-info{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--accent2);animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
.preview{display:flex;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--card)}.preview img{height:56px;width:56px;object-fit:cover;border-radius:10px}
.toast{background:var(--ok);color:#06251a;padding:8px 14px;margin:0 12px;border-radius:10px;font-weight:700;font-size:13px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}.lightbox img{max-width:92vw;max-height:90vh;border-radius:12px}
.lb-close{position:absolute;top:16px;right:20px;background:none;border:0;color:#fff;font-size:40px}

/* áudio */
.audio{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0 4px}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:13px;flex:none;display:flex;align-items:center;justify-content:center}
.bubble.me .play{background:#fff;color:var(--accent-d)}
.wave{flex:1;height:30px;display:flex;align-items:center;gap:2px}.wave span{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.3}.wave span.on{opacity:1}
.dur{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85;width:34px;text-align:right}

/* aparência */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:560px;margin-top:16px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .12s;box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}.sw:hover{transform:scale(1.1)}
.sw.sel{border-color:var(--text)}.sw.custom{position:relative;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);margin:0;overflow:hidden;cursor:pointer}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.sw.custom span{pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.seg{display:inline-flex;background:var(--card2);border-radius:14px;padding:4px;margin-top:6px}.seg button{border:0;background:none;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted)}.seg button.on{background:var(--accent);color:#fff}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin:6px 0 14px}.mini .row{animation:none}

@media(max-width:700px){
  .shell{flex-direction:column-reverse}.tabs{width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;gap:2px}
  .brand,.me-mini{display:none}.tabs>button{flex:1;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10px}.tabs .ic{background:none!important;width:auto;height:auto}
  main{padding:16px}.grid,.grid.one,.rooms{grid-template-columns:1fr}.three{grid-template-columns:1fr}
}

/* ---- novidades: reações, status, selos, stickers, verificação ---- */
select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;width:100%}
.inline select{width:auto;min-width:170px;flex:none}.inline input:disabled{opacity:.5}
.col{display:flex;flex-direction:column;min-width:0}.row.mine .col{align-items:flex-end}
.verified{vertical-align:-3px;flex:none}.h-row{display:flex;align-items:center;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.title-pill{background:var(--accent-soft);border:1px solid var(--accent);padding:3px 11px;border-radius:20px;font-size:12px;font-weight:800}
.mini-title{background:var(--accent-soft);padding:1px 8px;border-radius:10px;font-size:10px;font-weight:800;color:var(--text)}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);padding:3px 11px;border-radius:20px;font-size:12px}
.status-pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:3px}
.react-btn{background:none;border:0;opacity:0;font-size:13px;padding:0 2px;color:inherit;transition:opacity .15s}
.bubble:hover .react-btn,.react-btn:focus-visible{opacity:.8}.react-btn:hover{opacity:1}
@media(hover:none){.react-btn{opacity:.6}}
.picker{position:absolute;bottom:calc(100% + 4px);right:0;z-index:6;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px 6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.row:not(.mine) .picker{right:auto;left:0}
.picker button{background:none;border:0;font-size:22px;padding:3px 5px;border-radius:50%;transition:transform .12s}.picker button:hover{transform:scale(1.3)}
.rpills{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rpill{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:1px 8px;font-size:13px}.rpill.mine{border-color:var(--accent);background:var(--accent-soft)}
.bubble.bare{background:none!important;padding:0}.bubble.bare .meta{color:var(--muted)}
.sticker{display:block;width:140px;height:140px;margin:2px 0}
.spanel{border-top:1px solid var(--line);background:var(--card);padding:10px 14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px;max-height:190px;overflow:auto}
.sitem{background:none;border:1px solid transparent;border-radius:12px;padding:4px;transition:.12s}.sitem:hover{border-color:var(--accent);background:var(--accent-soft)}.sitem img{width:100%;display:block}
.icon-btn.active{border-color:var(--accent);background:var(--accent-soft)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}.banner em{font-style:normal;color:var(--muted)}.banner .btn{margin:0;flex:none}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.err{color:#ef4444;font-weight:700;font-size:14px;margin:8px 0 0}
.evform input,.evform textarea{width:100%}.evlist{display:grid;gap:14px}
.ev{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid hsl(var(--rh) 80% 55%);border-radius:18px;padding:14px;max-width:760px}
.ev-ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;background:linear-gradient(135deg,hsl(var(--rh) 85% 58%),hsl(calc(var(--rh) + 40) 80% 42%))}
.ev-top{display:flex;gap:10px;align-items:center;margin-bottom:2px}.ev-rel{background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.ev-desc{margin:6px 0;line-height:1.45}.ev-foot{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}.ev-foot .avatar{vertical-align:middle}.ev-count{margin-left:auto}.ev-foot .btn{margin:0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;opacity:.72}
.bd.done{opacity:1;border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}.bd.sel{box-shadow:0 0 0 2px var(--accent)}
.bd-ic{font-size:30px;filter:grayscale(1)}.bd.done .bd-ic{filter:none}.bd-name{font-weight:800}.bd-desc{font-size:12px;color:var(--muted);flex:1}
.prog{position:relative;height:16px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:6px}.prog div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-d))}.prog span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:16px}
.bd-btn{margin-top:8px;border:1px solid var(--accent);background:transparent;color:var(--text);border-radius:10px;padding:6px 8px;font-weight:700;font-size:12px}.bd-btn.on{background:var(--accent);color:#fff}
.locked{margin-top:8px;font-size:12px;color:var(--muted)}
.award{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;font-weight:800;padding:12px 22px;border-radius:30px;box-shadow:0 12px 36px rgba(0,0,0,.45);z-index:60;animation:rise .35s ease-out}

/* =====================================================================
   NEXO — modernização visual (camada final)
   Padrão único: raios, espaços e sombras abaixo valem para o app inteiro.
   ===================================================================== */
:root{--r-sm:14px;--r-md:20px;--r-lg:26px;--r-pill:999px;--sp-1:6px;--sp-2:10px;--sp-3:16px;--sp-4:24px;
  --sh-1:0 1px 2px rgba(0,0,0,.05),0 4px 14px -8px rgba(0,0,0,.14);--sh-2:0 2px 4px rgba(0,0,0,.05),0 14px 34px -16px rgba(0,0,0,.28);
  --safe-b:env(safe-area-inset-bottom,0px)}
h2{letter-spacing:-.5px}
/* botões, campos */
.btn{border-radius:var(--r-sm);padding-block:12px;font-weight:800}
.btn.ghost{border-radius:var(--r-sm)}
textarea,.form input:not([type=checkbox]),select{border-radius:var(--r-sm);border-color:var(--line)}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:1px}
.chip{border-radius:var(--r-pill)}
.seg{border-radius:var(--r-pill);padding:4px}.seg button{border-radius:var(--r-pill)}
/* cartões */
.card,.rcard{border-radius:var(--r-md);box-shadow:var(--sh-1);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.pcard{border-radius:var(--r-lg);box-shadow:var(--sh-1);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.pcard:hover{box-shadow:var(--sh-2)}
.lcard{border-radius:var(--r-md)}
.modal,.auth-card,.empty-card,.qcard,.mini{border-radius:var(--r-lg)}
.sheet-photos img,.slot{border-radius:var(--r-md)}
.title-pill{border-radius:var(--r-pill)}
.click:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}

/* navegação: barra lateral no computador */
.tabs{border-right:1px solid color-mix(in srgb,var(--line) 70%,transparent);gap:4px}
.tabs>button{border-radius:var(--r-sm);padding:11px 14px}
.tabs>button.active{background:var(--accent-soft);color:var(--text)}
.tabs>button .ic{width:30px;height:30px}
.me-mini{border-radius:var(--r-md)}

/* navegação: barra flutuante no celular */
@media(max-width:700px){
  .shell{background:var(--bg)}
  .tabs{margin:0 12px calc(10px + var(--safe-b));width:auto;padding:6px;gap:2px;border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:30px;
    background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh-2);flex:none}

/* cartão de perfil */

.chat.dm .bubble:has(>.chat-img):not(:has(>.txt)) .meta{right:8px;bottom:8px}
.chat.dm .inputbar:focus-within{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 38%,transparent)}
.chat.dm .bubble:has(>.chat-img):has(>.txt){display:block}
.chat.dm .bubble:has(>.chat-img):has(>.txt) .chat-img{margin:0 0 6px}
.chat.dm .bubble:has(>.chat-img):has(>.txt) .meta{display:flex;justify-content:flex-end;margin:2px 0 0}

/* ===== Etapa visual 3.1b: conversa mais próxima do Direct (balões sóbrios, fotos como mídia, barra única) ===== */
.chat.dm{--me:var(--bubble-me,#bd4b76);--rx:#f3f3f5;--rx-line:#e2e2e6;--ph:#e9e9ed}
:root[data-mode=dark] .chat.dm{--bg:#0e1013;--card:#15171b;--card2:#1c1f24;--line:#2a2e35;--rx:#1d2025;--rx-line:#2b2f36;--ph:#171a1e}
:root[data-mode=dark] body:has(.chat.dm),:root[data-mode=dark] .shell:has(.chat.dm){background:#0e1013}
.chat.dm .msgs{padding:10px 12px 0}
/* balões */
.chat.dm .row{margin-bottom:10px;gap:6px}
.chat.dm .row.join-next{margin-bottom:2px}
.chat.dm .col{max-width:min(76%,480px)}
.chat.dm .bubble{font-size:15px;line-height:1.36;padding:7px 12px 6px;column-gap:8px;border-radius:19px;box-shadow:none;filter:none}
.chat.dm .bubble:not(.me){background:var(--rx);border:1px solid var(--rx-line);color:var(--text)}
.chat.dm .bubble.me{background-color:var(--me)!important;background-image:none!important;border:0;color:#fff}
.chat.dm .bubble.me .meta,.chat.dm .bubble.me .time{color:rgba(255,255,255,.72)}
.chat.dm .meta{font-size:10px;opacity:.7;padding-top:3px}
.chat.dm .row.mine.join-prev .bubble.me{border-top-right-radius:5px}.chat.dm .row.mine.join-next .bubble.me{border-bottom-right-radius:5px}
.chat.dm .row:not(.mine).join-prev .bubble{border-top-left-radius:5px}.chat.dm .row:not(.mine).join-next .bubble{border-bottom-left-radius:5px}
.chat.dm .row.mine:not(.join-next) .bubble.me{border-bottom-right-radius:19px}.chat.dm .row:not(.mine):not(.join-next) .bubble{border-bottom-left-radius:19px}
.chat.dm .tick.read{color:#fff}
.chat.dm .day-sep{margin:16px auto 10px;font-size:11px;font-weight:600;color:var(--muted);text-transform:none}
/* fotos: mídia solta, sem cartão colorido */
.chat.dm .bubble:has(>.chat-img){background:none!important;background-image:none!important;border:0!important;padding:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:100%;position:static}
.chat.dm .row.mine .bubble:has(>.chat-img){align-items:flex-end}
.chat.dm .bubble>.chat-img{flex:none;display:block;width:auto;height:auto;max-width:min(100%,250px);max-height:320px;object-fit:contain;border-radius:18px;margin:0;background:var(--ph);border:1px solid var(--rx-line)}
.chat.dm .bubble:has(>.chat-img)>.txt{flex:none;max-width:100%;padding:7px 12px;border-radius:18px;font-size:15px;line-height:1.36}
.chat.dm .row:not(.mine) .bubble:has(>.chat-img)>.txt{background:var(--rx);border:1px solid var(--rx-line)}
.chat.dm .row.mine .bubble:has(>.chat-img)>.txt{background:var(--me);color:#fff}
.chat.dm .bubble:has(>.chat-img)>.meta,.chat.dm .bubble.me:has(>.chat-img)>.meta{position:static;margin:0 2px;padding:0;background:none;color:var(--muted);opacity:1;align-self:flex-end;display:flex}
.chat.dm .bubble.me:has(>.chat-img) .time{color:var(--muted)}
.chat.dm .bubble:has(>.chat-img) .tick{color:var(--muted)}.chat.dm .bubble:has(>.chat-img) .tick.read{color:var(--me)}
.chat.dm .row:not(.mine) .bubble:has(>.chat-img)>.meta{align-self:flex-start}
.chat.dm .bubble .media-ph{background:var(--ph);color:var(--muted)}
/* cabeçalho */
.chat.dm header{padding:6px 6px 6px 2px;gap:8px;min-height:54px}
.chat.dm header .prof-btn .avatar,.chat.dm header>.avatar{width:36px!important;height:36px!important;border-radius:50%}
.chat.dm header .title{font-size:16px;font-weight:700}
.chat.dm header .small-t{font-size:12px;color:var(--muted)}
.chat.dm header .ghost-ic{width:38px;height:38px;opacity:.8}
.chat.dm header .ghost-ic svg{width:20px;height:20px}
/* barra de composição única */
.chat.dm .inputbar{margin:6px 10px calc(8px + var(--safe-b));padding:3px 4px 3px 6px;gap:0;border-radius:26px;background:var(--rx);border:1px solid var(--rx-line);align-items:center}
.chat.dm .inputbar .icon-btn{width:38px;height:38px;color:var(--muted);flex:none}
.chat.dm .inputbar .icon-btn svg{width:20px;height:20px}
.chat.dm .inputbar #msg{height:40px;padding:0 6px;font-size:16px;background:transparent;border:0}
.chat.dm .inputbar .icon-btn.mic{color:var(--muted)!important;background:transparent!important}
.chat.dm .inputbar .btn.send{box-sizing:border-box;width:44px;height:44px;border:5px solid transparent;background:var(--me)!important;background-clip:content-box!important;-webkit-background-clip:content-box!important;margin:-2px -2px -2px 0}
.chat.dm .inputbar .btn.send::before{width:16px;height:16px}
.chat.dm .inputbar:focus-within{box-shadow:none;border-color:color-mix(in srgb,var(--text) 28%,transparent)}
.chat.dm .ideas .idea{border-color:color-mix(in srgb,var(--me) 60%,transparent)}
@media(max-width:360px){.chat.dm .inputbar .icon-btn{width:36px;height:36px}.chat.dm .col{max-width:80%}}
.chat.dm .bubble:has(>.chat-img):has(>.txt){display:flex;width:fit-content}
.chat.dm .bubble:has(>.chat-img):has(>.txt)>.txt{align-self:inherit;width:fit-content}
.chat.dm .bubble:has(>.chat-img):has(>.txt) .chat-img{margin:0}
.chat.dm .bubble:has(>.chat-img):has(>.txt)>.meta{margin:0 2px;justify-content:flex-end}

/* ===== Etapa 3.2: responder mensagens (arrastar para a direita, prévia e referência) ===== */
.chat.dm .msgs{overflow-x:hidden}
.chat.dm .row{position:relative;touch-action:pan-y}
.chat.dm .row.swiping{user-select:none;-webkit-user-select:none}

.swipe-ic{position:absolute;left:-44px;top:50%;width:30px;height:30px;margin-top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--rx,#eee);color:var(--muted);opacity:0;transform:translateY(-50%) scale(.6);pointer-events:none}

.reply-btn{flex:none;align-self:center;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;opacity:0;cursor:pointer}
.row:hover>.reply-btn,.reply-btn:focus-visible{opacity:1}
.reply-btn:hover{background:var(--rx,#eee);color:var(--text)}
.reply-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media(hover:none){.reply-btn{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}.reply-btn:focus-visible{opacity:1;width:30px;height:30px;pointer-events:auto}}
.menu .menu-reply{font-weight:600}
/* referência dentro da mensagem */
.chat.dm .qref{display:block;flex:0 0 100%;width:0;min-width:100%;box-sizing:border-box;text-align:left;font:inherit;cursor:pointer;margin:0 0 5px;padding:4px 9px;border:0;border-left:3px solid var(--me);border-radius:10px;background:rgba(127,127,127,.16);color:inherit;overflow:hidden}
.chat.dm .qref b{display:block;font-size:11px;font-weight:700;line-height:1.3;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat.dm .qref span{display:block;font-size:12.5px;line-height:1.35;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat.dm .bubble.me .qref{background:rgba(255,255,255,.17);border-left-color:rgba(255,255,255,.75);color:#fff}
.chat.dm .bubble:has(>.qref){min-width:min(190px,76vw)}
.chat.dm .bubble:has(>.chat-img)>.qref{flex:none;width:auto;min-width:0;max-width:min(100%,250px);background:var(--rx);border:1px solid var(--rx-line);border-left:3px solid var(--me);color:var(--text)}
.chat.dm .bubble:has(>.chat-img){min-width:0}
.chat.dm .row.hl .bubble{outline:2px solid var(--me);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.chat.dm .row.hl .bubble{animation:hlpulse 1.2s ease-out}}
@keyframes hlpulse{0%{outline-offset:6px;outline-color:transparent}20%{outline-offset:2px;outline-color:var(--me)}}
/* prévia da resposta acima do campo */
.chat.dm .reply-bar{display:flex;align-items:center;gap:8px;margin:6px 10px -2px;padding:7px 4px 7px 12px;border:1px solid var(--rx-line);border-left:3px solid var(--me);border-radius:16px;background:var(--rx);color:var(--text)}
.chat.dm .reply-bar .rb-ic{flex:none;color:var(--muted);display:flex}
.chat.dm .reply-bar .rb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.chat.dm .reply-bar b{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat.dm .reply-bar span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat.dm .reply-bar .rb-x{flex:none;width:38px;height:38px;font-size:24px;line-height:1;color:var(--muted);background:transparent!important}
.chat.dm .row:not(.mine)>.reply-btn{margin-left:22px}
.chat.dm .row.mine>.reply-btn{margin-right:2px}

/* ===== Etapa visual 5: tela Avisos (lista limpa, nome em destaque) ===== */
:root[data-mode=dark] .shell:has(.avisos){--bg:#14161b;--card:#1c1f26;--card2:#252932;--line:#2e333d;--text:#eef0f4;--muted:#9ba2af;background:var(--bg)}

.avisos .av-list{display:flex;flex-direction:column;margin:0 -8px}
.avisos .notif-item.av-item{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:var(--text);background:transparent;border:0;border-radius:14px;padding:10px 8px;margin:0;position:relative;justify-content:flex-start}
.avisos button.av-item{cursor:pointer}
.avisos button.av-item:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}

.avisos .av-pic{position:relative;flex:none;width:48px;height:48px}

.avisos .av-badge{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:13px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.avisos .av-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.avisos .av-top{display:flex;align-items:baseline;gap:8px;min-width:0}

.avisos .av-item[data-kind=like] .av-name,.avisos .av-item[data-kind=plike] .av-name,.avisos .av-item[data-kind=comment] .av-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:500}

.avisos .av-item.new .av-sub{color:var(--text)}
.avisos .av-item:not(.new) .av-pic{opacity:.92}
.avisos .av-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.avisos .notif-item.new b{color:var(--text)}
@media(max-width:360px){.avisos .av-head h2{font-size:28px}.avisos .av-sub{font-size:13.5px}}
@media(min-width:701px){.avisos{max-width:640px}}

.avisos .av-top{align-items:flex-start}.avisos .av-time{padding-top:2px}

/* ===== Etapa visual 5.1: Avisos sociais (estilo Instagram, identidade NEXO) ===== */
.avisos .av-head{margin-bottom:2px}
.avisos .av-desc{margin:0 0 10px;font-size:13.5px;line-height:1.4}
.avisos .av-enable{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;margin:0 0 8px}

.avisos .av-enable .btn{flex:none;min-height:36px;padding:0 14px;border-radius:999px}
.avisos .av-perm{font-size:12.5px;margin:0 0 8px}
.avisos .av-empty{padding:40px 16px}.avisos .av-empty span{font-size:40px;color:var(--accent);opacity:.8}.avisos .av-empty b{font-size:16px}

/* ===== Etapa visual 6: consistência entre telas ===== */
/* mesmo fundo carvão em todas as abas no tema escuro (Salas e Momentos estavam em preto puro) */
:root[data-mode=dark] .shell{--bg:#14161b;--card:#1c1f26;--card2:#252932;--line:#2e333d;--text:#eef0f4;--muted:#9ba2af;background:var(--bg)}
:root[data-mode=dark] .shell .topbar{background:var(--bg)}
:root[data-mode=dark] body:has(.shell){background:#14161b}
/* aba ativa da barra de baixo: sem o contorno rosa preso depois do toque (fica só para teclado no computador) */
.tabs>button{-webkit-tap-highlight-color:transparent}
.tabs>button:focus:not(:focus-visible){outline:0}

.momentos .qcard{flex-direction:row;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:16px;margin:0 0 4px;border-color:transparent;background:color-mix(in srgb,var(--accent) 9%,var(--card))}

/* ===== Etapa 8: aviso de mensagem dentro do app (faixa no topo) ===== */
.msg-banner{position:fixed;z-index:120;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:min(calc(100% - 16px),460px);display:flex;align-items:center;gap:2px;padding:6px 4px 6px 8px;border-radius:20px;background:color-mix(in srgb,#1c1f26 92%,transparent);color:#eef0f4;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px -10px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);touch-action:none;animation:mbIn .32s cubic-bezier(.2,.8,.2,1)}
:root:not([data-mode=dark]) .msg-banner{background:color-mix(in srgb,#fff 94%,transparent);color:#262626;border-color:rgba(0,0,0,.08);box-shadow:0 14px 40px -12px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.08)}
@keyframes mbIn{from{opacity:0;transform:translate(-50%,-24px)}to{opacity:1;transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){.msg-banner{animation:none}}
.msg-banner .mb-main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:2px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:14px}
.msg-banner .mb-main .avatar{width:42px!important;height:42px!important;flex:none}
.msg-banner .mb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.msg-banner .mb-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.msg-banner .mb-name{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-banner .mb-top small{flex:none;font-size:11.5px;opacity:.6}
.msg-banner .mb-sub{font-size:14px;line-height:1.3;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.msg-banner .mb-sub em{font-style:normal;font-weight:700;color:var(--accent)}
.msg-banner .mb-x{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:inherit;opacity:.55;font-size:22px;line-height:1;cursor:pointer}
.msg-banner .mb-x:hover{opacity:.9;background:rgba(127,127,127,.15)}
.msg-banner button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Etapa 9: câmera no chat e foto de visualização única ===== */
.nx-cam{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:flex;flex-direction:column}
.cam-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
.cam-to{flex:1;font-size:14px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam-ic{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1;cursor:pointer;flex:none}
.cam-top .cam-ic:first-child+.cam-ic{margin-left:auto}
.cam-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam-video,.cam-shot{width:100%;height:100%;object-fit:cover;background:#111}
.cam-shot{object-fit:contain}
.cam-video.mirror{transform:scaleX(-1)}
.cam-err{max-width:320px;text-align:center;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.cam-err p{margin:0;opacity:.85;line-height:1.45}
.cam-bottom{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px);min-height:112px}
.cam-shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;cursor:pointer}
.cam-shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s}
.cam-shutter:active i{transform:scale(.88)}
.cam-shutter:disabled{opacity:.4}
.cam-pill{border:0;border-radius:999px;padding:12px 16px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.cam-once{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px 9px 9px;background:transparent;color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.cam-once.on{background:#fff;color:#111;border-color:#fff}
.once-ic{width:24px;height:24px;flex:none;border-radius:50%;border:2px dashed currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.cam-send{width:56px;height:56px;margin-left:auto;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;flex:none}
.cam-bottom .cam-pill+.cam-send{margin-left:auto}
.nx-cam button:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* visualização única: o próprio balão (com a cor normal de enviada/recebida) envolve ícone + texto + horário, sem caixa extra */
.once-chip{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.once-chip>span:last-child{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.once-chip b{font-size:15px;font-weight:600}.once-chip small{font-size:12px;opacity:.72;overflow-wrap:anywhere}
.once-chip .once-ic{width:26px;height:26px;color:var(--accent)}
.once-chip.mine{cursor:default}.once-chip.mine .once-ic{color:currentColor}
.once-chip.done{cursor:default;opacity:.75}.once-chip.done .once-ic{color:var(--muted)}
.once-chip:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.chat.dm .bubble:has(>.once-chip){display:flex;flex-wrap:nowrap;align-items:flex-end;column-gap:12px;padding:8px 12px 7px 10px}
.chat.dm .bubble:has(>.once-chip)>.meta{margin:0;padding:0 0 1px;flex:none}
.once-view{background:#000!important}
.once-view img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none}
.once-note{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px;white-space:nowrap}
@media(max-width:360px){.cam-once{font-size:13px;padding-right:10px}.cam-bottom{gap:10px}}
.cam-pill,.cam-once{white-space:nowrap}
@media(max-width:360px){.cam-pill{padding:10px 12px;font-size:13.5px}.cam-once{padding:7px 10px 7px 7px;font-size:13px}.cam-send{width:52px;height:52px}}

/* ===== Etapa 10: campo de mensagem (textarea que cresce) e aviso "novas mensagens" ===== */
.chat textarea#msg{resize:none;display:block;box-sizing:border-box;font:inherit;line-height:20px;overflow-y:auto;scrollbar-width:none}
.chat textarea#msg::-webkit-scrollbar{display:none}
.chat.dm .inputbar textarea#msg{height:40px;min-height:40px;max-height:124px;padding:10px 6px;font-size:16px;align-self:center}
.chat.dm .inputbar{align-items:flex-end}
.chat.dm .inputbar .icon-btn,.chat.dm .inputbar .btn.send{margin-bottom:1px}
.chat .msgs{overflow-anchor:none;overscroll-behavior:contain}
.new-below{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b,0px));z-index:6;border:0;border-radius:999px;padding:8px 14px;background:var(--accent);color:#fff;font:inherit;font-size:13.5px;font-weight:700;box-shadow:0 8px 22px -8px rgba(0,0,0,.5);cursor:pointer}

/* ===== Etapa 13: conversa inteira no estilo Instagram Direct (fundo, cabeçalho, mensagens, barra) ===== */
/* tokens da conversa: uma tela contínua (preto no escuro, branco no claro), recebidas cinza, enviadas em degradê azul→roxo */
.chat.dm{--bg:#ffffff;--rx:#efefef;--rx-line:transparent;--ph:#efefef;--ink:#000;--sub:#737373;--bar:#efefef;--icon:#000;
  --me:var(--bubble-me,#4f5ce8);--me-grad:linear-gradient(135deg,#3f8cf5 0%,#6a4ff0 55%,#9b3ff0 100%);background:var(--bg);color:var(--ink)}
:root[data-mode=dark] .chat.dm{--bg:#000;--card:#121212;--card2:#262626;--line:#262626;--text:#f5f5f5;--muted:#a8a8a8;--rx:#262626;--rx-line:transparent;--ph:#1a1a1a;--ink:#f5f5f5;--sub:#a8a8a8;--bar:#262626;--icon:#f5f5f5}
:root[data-mode=dark] body:has(.chat.dm),:root[data-mode=dark] .shell:has(.chat.dm){background:#000}
.chat.dm .msgs{background:var(--bg)}
/* cabeçalho compacto, sem divisória, fixo no topo da conversa */
.chat.dm header{position:relative;z-index:3;display:flex;align-items:center;gap:10px;min-height:56px;padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px 4px;background:var(--bg);border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.chat.dm header .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:50%;background:transparent;color:var(--icon);flex:none}
.chat.dm header .prof-btn{flex:none;padding:0;border:0;background:none}
.chat.dm header .prof-btn .avatar,.chat.dm header>.avatar{width:36px!important;height:36px!important;border-radius:50%;object-fit:cover}
.chat.dm header .grow{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;cursor:pointer}
.chat.dm header .title{font-size:16px;font-weight:700;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat.dm header .small-t{font-size:12.5px;line-height:1.2;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.chat.dm header .status-pill{margin-top:2px}
.chat.dm header .ghost-ic{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;background:transparent!important;color:var(--icon);opacity:1}
.chat.dm header .ghost-ic svg{width:24px;height:24px}
.chat.dm header .ghost-ic:hover,.chat.dm header .back:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)!important}
/* mensagens */
.chat.dm .msgs{padding:8px 10px 2px}
.chat.dm .row{gap:6px;margin-bottom:8px}
.chat.dm .row.join-next{margin-bottom:2px}
.chat.dm .col{max-width:min(74%,440px)}
.chat.dm .bubble{font-size:15px;line-height:1.35;padding:8px 12px 7px;border-radius:22px;border:0;box-shadow:none;column-gap:8px}
.chat.dm .bubble:not(.me){background:var(--rx);border:0;color:var(--ink)}
.chat.dm .bubble.me:not(:has(>.chat-img)){background-color:var(--me)!important;background-image:var(--me-grad)!important;color:#fff}
.chat.dm.has-color .bubble.me{background-image:none!important}
.chat.dm .row.mine.join-prev .bubble.me{border-top-right-radius:6px}.chat.dm .row.mine.join-next .bubble.me{border-bottom-right-radius:6px}
.chat.dm .row:not(.mine).join-prev .bubble{border-top-left-radius:6px}.chat.dm .row:not(.mine).join-next .bubble{border-bottom-left-radius:6px}
.chat.dm .row.mine:not(.join-next) .bubble.me{border-bottom-right-radius:22px}.chat.dm .row:not(.mine):not(.join-next) .bubble{border-bottom-left-radius:22px}
.chat.dm .meta{font-size:10.5px;opacity:1;color:var(--sub)}
.chat.dm .bubble.me .meta,.chat.dm .bubble.me .time{color:rgba(255,255,255,.75)}
.chat.dm .tick{color:inherit}.chat.dm .bubble.me .tick.read{color:#fff}
.chat.dm .day-sep{margin:14px auto 8px;font-size:11.5px;font-weight:600;color:var(--sub)}
.chat.dm .row>.prof-btn .avatar,.chat.dm .row>.avatar{width:28px!important;height:28px!important}
.chat.dm .dots{color:var(--sub)}
/* fotos: sem moldura; horário discreto abaixo */
.chat.dm .bubble>.chat-img{border:0;border-radius:20px;background:var(--ph);max-width:min(100%,260px)}
.chat.dm .row:not(.mine) .bubble:has(>.chat-img)>.txt{background:var(--rx);border:0}
.chat.dm .row.mine .bubble:has(>.chat-img)>.txt{background-color:var(--me);background-image:var(--me-grad);color:#fff}
.chat.dm.has-color .row.mine .bubble:has(>.chat-img)>.txt{background-image:none}
/* visualização única: mesmo balão das outras mensagens */
.chat.dm .bubble:has(>.once-chip){padding:9px 12px 8px 10px}
.chat.dm .once-chip .once-ic{width:28px;height:28px;font-size:12.5px;border-width:2px}
.chat.dm .row:not(.mine) .once-chip:not(.done) .once-ic{color:#a855f7}
/* referência de resposta e prévia */
.chat.dm .bubble:not(.me) .qref{background:color-mix(in srgb,var(--ink) 8%,transparent);border-left-color:#7c5cf0}
.chat.dm .reply-bar{background:var(--bar);border:0;border-left:3px solid #7c5cf0;border-radius:16px}
/* barra de digitação: pílula única, câmera em destaque à esquerda (como no Direct) */
.chat.dm .inputbar{margin:4px 8px calc(env(safe-area-inset-bottom,0px) + 8px);padding:4px 6px 4px 4px;gap:2px;min-height:48px;border:0;border-radius:24px;background:var(--bar);align-items:flex-end;box-shadow:none}
.chat.dm .inputbar:focus-within{box-shadow:none;border:0}
.chat.dm .inputbar #cam-btn{order:0;width:40px;height:40px;border-radius:50%;background:var(--me-grad)!important;color:#fff!important;margin:0 2px 0 0}
.chat.dm.has-color .inputbar #cam-btn{background:var(--me)!important}
.chat.dm .inputbar #cam-btn svg{width:21px;height:21px}
.chat.dm .inputbar #msg{order:1;flex:1;color:var(--ink)}
.chat.dm .inputbar #msg::placeholder{color:var(--sub)}
.chat.dm .inputbar #attach{order:3}.chat.dm .inputbar #sticker-btn{order:2}.chat.dm .inputbar .mic,.chat.dm .inputbar .btn.send{order:5}
.chat.dm .inputbar .icon-btn{width:38px;height:40px;color:var(--icon);background:transparent!important;flex:none}
.chat.dm .inputbar .icon-btn svg{width:23px;height:23px}
.chat.dm .inputbar .icon-btn.mic{color:var(--icon)!important}
.chat.dm .inputbar .btn.send{width:44px;height:44px;border:4px solid transparent;background:var(--me-grad)!important;background-clip:padding-box!important;-webkit-background-clip:padding-box!important;margin:-2px -2px -2px 0;box-sizing:border-box}
.chat.dm.has-color .inputbar .btn.send{background:var(--me)!important;background-clip:padding-box!important}
@media(max-width:360px){.chat.dm .inputbar{gap:0;padding-right:4px}.chat.dm .inputbar .icon-btn{width:36px}.chat.dm .inputbar #cam-btn{width:36px;height:36px;margin-top:2px}.chat.dm .col{max-width:80%}}
.chat.dm .new-below{background:var(--me-grad);bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.chat.dm .ideas .idea{border-color:color-mix(in srgb,#7c5cf0 60%,transparent)}

/* ===== Etapa 15: tempo real ("digitando…", "online agora", "visto por último") ===== */
.chat.dm header .small-t.is-typing{color:#a78bfa;font-weight:600}
.chat.dm header .small-t.is-online{color:#22c55e;font-weight:600}
.chat.dm header .small-t.is-online::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:1px}

/* ---- Etapa 16: reações (dois toques = ❤️, segurar = barra de reações e menu) ---- */
.chat.dm .bubble, .chat.dm .once-chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chat.dm .row{-webkit-tap-highlight-color:transparent}
.chat.dm .row.mine .menu{left:auto;right:0}
.chat.dm .menu{z-index:9;min-width:170px;border-radius:14px}
.chat.dm .menu .menu-copy{font-weight:500}
.chat.dm .picker{z-index:10;padding:6px 8px;border-radius:28px;animation:rx-pop .16s cubic-bezier(.2,.9,.3,1.3)}
.chat.dm .picker button{font-size:26px;padding:4px 6px}
.chat.dm .rpills{margin-top:-8px;position:relative;z-index:2;padding:0 8px}
.chat.dm .row.mine .rpills{justify-content:flex-end}
.chat.dm .rpill{font-size:14px;line-height:20px;padding:1px 6px;border-radius:12px;background:var(--card2,#262626);border:2px solid var(--bg,#000)}
.chat.dm .rpill.mine{background:var(--card2,#262626);border-color:var(--bg,#000)}
.chat.dm .rpill.pop{animation:rx-pop .25s cubic-bezier(.2,.9,.3,1.4)}
@keyframes rx-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.chat.dm .picker,.chat.dm .rpill.pop{animation:none}}
.chat.dm .menu.under-picker{top:calc(100% + 58px)}

/* ---- Etapa 17: apagar para todos e editar ---- */
.chat.dm .bubble.is-deleted{background:transparent!important;border:1px solid var(--line)!important;box-shadow:none!important}
.chat.dm .deleted-txt{font-style:italic;color:var(--muted)!important;font-size:14px}
.chat.dm .bubble.is-deleted .meta .time{color:var(--muted)}
.chat.dm .meta .edited{font-size:11px;opacity:.75;margin-right:4px}
.chat.dm .menu .menu-edit{font-weight:500}
.chat.dm .edit-bar{border-left-color:#f5a524!important}
.del-confirm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.del-confirm .del-box{background:var(--card);color:var(--text);border-radius:18px;padding:20px 18px 14px;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.del-confirm b{font-size:17px}
.del-confirm p{margin:8px 0 16px;color:var(--muted);font-size:14px;line-height:1.4}
.del-confirm .del-act{display:flex;gap:8px;justify-content:flex-end}
.del-confirm .danger-btn{background:#ef4444;color:#fff;border-color:#ef4444}
.chat.dm .bubble.me.is-deleted:not(:has(>.chat-img)),.chat.dm .bubble.is-deleted{background-color:transparent!important;background-image:none!important;color:var(--muted)}
.chat.dm .bubble.me.is-deleted .meta,.chat.dm .bubble.me.is-deleted .time,.chat.dm .bubble.me.is-deleted .tick{color:var(--muted)}

/* ---- Etapa 20: lista de Chats mais viva ---- */
.chats .av-wrap{position:relative;flex:none;display:inline-flex;width:52px;height:52px}
.chats .on-dot{position:absolute;right:0;bottom:1px;width:14px;height:14px;border-radius:50%;background:#22c55e;border:2.5px solid var(--bg,#000)}
@media(max-width:360px){.chats .av-wrap{width:48px;height:48px}}
.chats .convo .last.is-typing{color:#22c55e;font-weight:600;font-style:italic}
.chats .convo .last.is-react{font-style:italic}
.chats .convo .last.is-gone{font-style:italic;opacity:.8}
.chats .ct-pin,.chats .ct-mute{font-size:12px;margin-left:4px;vertical-align:1px;opacity:.85}
.chats .convo.pinned{background:color-mix(in srgb,var(--card2,#262626) 55%,transparent)}
.chats .convo{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.convo-menu-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.convo-menu{width:100%;max-width:480px;background:var(--card,#121212);color:var(--text,#f5f5f5);border-radius:20px 20px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px;box-shadow:0 -10px 40px rgba(0,0,0,.45);animation:cm-up .18s ease-out}
.convo-menu b{padding:8px 12px 10px;font-size:15px;color:var(--muted,#a8a8a8)}
.convo-menu button{background:none;border:0;color:inherit;text-align:left;font-size:16px;padding:14px 12px;border-radius:12px}
.convo-menu button:hover,.convo-menu button:focus-visible{background:var(--card2,#262626)}
.convo-menu .cm-cancel{color:var(--muted,#a8a8a8);margin-top:4px;text-align:center}
@keyframes cm-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.convo-menu{animation:none}}

/* ---- Etapa 21: áudio (gravar segurando, velocidade, mini player) ---- */
.audio .rate{flex:none;background:color-mix(in srgb,currentColor 16%,transparent);color:inherit;border:0;border-radius:10px;padding:3px 7px;font-size:12px;font-weight:700;min-width:36px}
.chat.dm .audio{gap:8px}
.chat.dm .audio .wave{cursor:pointer}
.chat.dm .inputbar{position:relative}
.chat.dm .inputbar #mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chat.dm .inputbar #mic.hot{color:#fff!important;background:#ef4444!important;transform:scale(1.25);box-shadow:0 0 0 6px rgba(239,68,68,.25);transition:transform .12s;z-index:3}
.chat.dm .inputbar .rec-hold{position:absolute;left:8px;right:56px;top:6px;bottom:6px;z-index:2;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:24px;background:var(--bar,#262626);color:var(--text,#f5f5f5)}
.chat.dm .inputbar .rec-hold span{margin-left:auto;font-size:13px;color:var(--muted,#a8a8a8)}
.chat.dm .inputbar .rec-hold.armed span{color:#ef4444;font-weight:700}
.chat.dm .inputbar.holding>*:not(.rec-hold):not(#mic){visibility:hidden}
.mini-audio{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:6px 8px 6px 6px;border-radius:28px;background:var(--card,#1c1f26);color:var(--text,#eee);border:1px solid var(--line,#2e333d);box-shadow:0 8px 28px rgba(0,0,0,.45)}

.mini-audio .ma-txt small{font-size:11px;color:var(--muted,#a8a8a8);font-variant-numeric:tabular-nums}
.mini-audio .ma-rate{border:0;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700;background:var(--card2,#252932);color:inherit;flex:none}
.mini-audio .ma-x{border:0;background:none;color:var(--muted,#a8a8a8);font-size:22px;line-height:1;padding:0 6px;flex:none}

/* ---- Etapa 22: várias fotos e encaminhar ---- */
.preview .pv-thumbs{display:flex;gap:6px;overflow-x:auto;max-width:62%;padding:2px 0}

.fwd-sheet{width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;background:var(--card,#121212);color:var(--text,#f5f5f5);border-radius:20px 20px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.45);animation:cm-up .18s ease-out}

.fwd-row:hover,.fwd-row:focus-visible{background:var(--card2,#262626)}
.fwd-row .fwd-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwd-row .fwd-chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted,#a8a8a8);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#fff}

/* Etapa 23: tela Salas no estilo do resto do app */
.rooms-page{padding-bottom:12px}
.rooms-head h2{margin:0}.rooms-head .muted{margin:2px 0 0;font-size:15px}
.rooms-seg{display:flex;width:100%;margin:14px 0 6px}.rooms-seg button{flex:1;padding:10px 8px;font-size:14px}
.rooms-note{margin:8px 2px 0;line-height:1.4}
.rooms-page .rooms{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rooms-page .rcard{gap:14px;padding:12px 14px;min-height:76px;cursor:pointer;transition:background .15s,transform .1s}
.rooms-page .rcard:hover{background:var(--card2)}.rooms-page .rcard:active{transform:scale(.99)}
.rooms-page .rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rooms-page .r-ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:26px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.rooms-page .rcard .grow{min-width:0}.rooms-page .rcard .ct{font-size:16px;font-weight:800;letter-spacing:-.1px}
.rooms-page .r-desc{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rooms-page .r-side{display:flex;align-items:center;gap:8px;flex:none}
.rooms-page .r-online{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.rooms-page .r-online i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.rooms-page .r-go{font-size:24px;color:var(--muted);line-height:1}
@media(min-width:700px){.rooms-page .rooms{display:grid;grid-template-columns:repeat(2,1fr)}}
.rooms-page .rcard .ct{color:var(--text)}

/* Etapa 24: sala ao vivo */
.room-live .room-empty{display:flex;flex-direction:column;gap:6px;text-align:center;margin:40px auto;max-width:30ch;color:var(--muted);font-size:14px;line-height:1.4}.room-live .room-empty b{color:var(--text);font-size:16px}
.room-live .room-from{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:2px}
.room-live .room-dots{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px;cursor:pointer}
.room-live .bubble{position:relative}.room-live .room-menu{top:26px;left:auto;right:0}
.room-live .room-menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--text)}.room-live .room-menu .danger{color:#d12a4b}

/* Etapa 26: responder e reagir nas salas */
.room-live .room-acts{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px;padding:4px 6px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);width:max-content;max-width:100%}
.room-live .row.mine .room-acts{margin-left:auto}
.room-live .room-rx{border:0;background:none;font-size:20px;line-height:1;padding:4px;border-radius:50%;cursor:pointer}.room-live .room-rx.mine{background:var(--accent-soft)}
.room-live .room-reply{border:0;background:none;font-size:13px;font-weight:700;color:var(--accent);padding:4px 8px;cursor:pointer}
.room-live .bubble{cursor:pointer}

/* Etapa 27: menções */
.room-live .mention{font-weight:800;color:var(--accent);border-radius:6px}
.room-live .bubble.me .mention{color:#fff;text-decoration:underline;text-underline-offset:2px}
.room-live .mention.me{background:var(--accent-soft);padding:0 3px}.room-live .bubble.me .mention.me{background:rgba(255,255,255,.22)}
.room-live .mention-list{display:flex;flex-wrap:wrap;gap:6px;margin:0 10px 6px}
.room-live .mention-opt{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r-pill);padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}

/* Etapa 28: busca na lista de Chats */
.chat-search{display:flex;align-items:center;gap:8px;margin:12px 0 4px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
.chat-search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:11px 0;font-size:16px;color:var(--text)}
.chat-search:focus-within{border-color:var(--accent)}
.chat-search input::-webkit-search-cancel-button{display:none}

.msg-hits{display:flex;flex-direction:column}

.msg-hit .mh-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.msg-hit .mh-txt b{font-size:15px}.msg-hit .mh-txt span{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- Etapa 33: sobre a sala, mensagem fixada, enquetes ---- */
.room-live .pin-bar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.room-live .pin-bar .pin-txt{display:flex;flex-direction:column;min-width:0;flex:1}

.room-live .pin-bar .pin-txt span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-live .pin-bar .pin-x{font-size:20px;padding:0 6px;opacity:.7}
.about-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.about-sheet{background:var(--card);color:var(--text);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}

.about-sheet .about-act .btn{white-space:nowrap}
.about-sheet .inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
.room-live .poll{display:flex;flex-direction:column;gap:6px;min-width:220px}

/* ---- Etapa 34: salas da galera e prazo de enquete ---- */

.menu .menu-moddel,.menu .menu-ban{color:var(--danger,#e5484d)}

/* ===== Etapa 36: animação de abertura ===== */
.splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0716;overflow:hidden;opacity:1;transition:opacity .4s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 65%);filter:blur(10px);opacity:0;animation:splash-glow 1.5s .1s ease-out both}
.splash-logo{position:relative;display:grid;place-items:center;animation:splash-pop .9s cubic-bezier(.25,.9,.3,1) both}
.splash-logo .logo-mark{box-shadow:0 10px 36px color-mix(in srgb,var(--accent) 45%,transparent)}
.splash-ring{position:absolute;inset:-14px;border-radius:30%;border:2px solid var(--accent);opacity:0;animation:splash-ring 1.1s .35s ease-out both}
.splash-word{position:relative;display:flex;gap:6px;font-size:40px;font-weight:900;letter-spacing:.14em;line-height:1}
.splash-word b{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(14px) scale(.9);animation:splash-letter .5s cubic-bezier(.2,.9,.3,1) both}
.splash-tag{position:relative;font-size:14px;font-weight:600;color:#a8a3bd;opacity:0;animation:splash-tag .6s 1.1s ease-out both}
@keyframes splash-bg{from{opacity:0}to{opacity:1}}
@keyframes splash-glow{0%{opacity:0;transform:scale(.5)}60%{opacity:1}100%{opacity:.7;transform:scale(1)}}
@keyframes splash-pop{0%{transform:translateY(46px) scale(3.1)}100%{transform:none}}

@keyframes splash-tag{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

m entrou nela. Cada pessoa pode ter uma conta."],["4. Regras de conviv\xEAncia","Voc\xEA concorda em seguir as regras de conviv\xEAncia do app: respeito, nada de ass\xE9dio, conte\xFAdo sexual expl\xEDcito, viol\xEAncia gr\xE1fica, ilegalidade, perfis falsos, golpes, spam, pedidos de dinheiro ou de dados pessoais. Tamb\xE9m n\xE3o pode divulgar fotos, conversas ou dados de outras pessoas sem permiss\xE3o."],["5. Salas de assistir e ler","Nas salas de assistir junto e de leitura, s\xF3 \xE9 permitido usar conte\xFAdo de fonte oficial ou autorizado pelos detentores dos direitos autorais (por exemplo, canais oficiais no YouTube e leituras gratuitas oficiais). \xC9 proibido indicar links de pirataria. O NEXO n\xE3o hospeda v\xEDdeos nem mang\xE1s: o v\xEDdeo toca no YouTube e a leitura abre no site indicado. Quem cria a sala \xE9 respons\xE1vel pelo link. Salas e mensagens que violem isso podem ser removidas e as contas, suspensas. Denuncie pelo bot\xE3o da sala."],["6. Seu conte\xFAdo","Fotos, textos, \xE1udios e mensagens continuam sendo seus. Voc\xEA nos autoriza a guard\xE1-los e exibi-los dentro do app, para as pessoas que podem v\xEA-los, apenas para o app funcionar. Envie s\xF3 o que voc\xEA tem direito de enviar."],["7. Den\xFAncias, bloqueio e remo\xE7\xE3o","Voc\xEA pode denunciar e bloquear qualquer pessoa. Podemos analisar den\xFAncias, remover conte\xFAdos e suspender ou excluir contas que descumpram estes termos, com ou sem aviso, sobretudo em casos de risco para outras pessoas."],["8. Seguran\xE7a entre pessoas","O NEXO n\xE3o verifica a identidade de ningu\xE9m (o selo de verifica\xE7\xE3o ainda n\xE3o existe na vers\xE3o online). Tenha cuidado: n\xE3o envie dinheiro, senhas ou documentos, e avise algu\xE9m de confian\xE7a antes de encontrar uma pessoa que conheceu aqui. Em risco imediato, ligue 190."],["9. Sem garantias","O app \xE9 oferecido como est\xE1, sem garantia de funcionamento cont\xEDnuo. N\xE3o nos responsabilizamos por atitudes de outros usu\xE1rios, dentro dos limites da lei. Nada aqui retira direitos que a lei garante a voc\xEA."],["10. Encerrar a conta","Voc\xEA pode excluir sua conta quando quiser em Perfil \u2192 Excluir minha conta. Isso apaga seus dados do servidor (veja a Pol\xEDtica de Privacidade)."],["11. Mudan\xE7as e contato",`Podemos atualizar estes termos; se a mudan\xE7a for importante, avisaremos no app. D\xFAvidas ou pedidos: ${Vh}. Lei aplic\xE1vel: a brasileira.`]],qC=[["1. Quem cuida dos seus dados",`O NEXO (projeto em fase de testes) \xE9 o respons\xE1vel pelos dados, nos termos da LGPD (Lei 13.709/2018). Contato para qualquer pedido sobre dados: ${Vh}.`],["2. Quais dados guardamos","E-mail e senha da conta (a senha fica protegida e n\xE3o conseguimos ler). Dados do perfil que voc\xEA preenche: apelido, idade, cidade, bio, gostos, favoritos, perguntas e respostas, status, fotos e \xE1udio de apresenta\xE7\xE3o. Suas curtidas, bloqueios, den\xFAncias, as mensagens que voc\xEA troca com quem deu match com voc\xEA e as salas, mensagens e progresso de leitura que voc\xEA cria ou envia nas salas de assistir e ler (vis\xEDveis para quem est\xE1 na sala), e as fotos, legendas, curtidas e coment\xE1rios que voc\xEA publica no Momentos (vis\xEDveis para os outros usu\xE1rios)."],["3. Para que usamos","Para criar sua conta, mostrar seu perfil a outras pessoas, formar matches, permitir conversas, manter a seguran\xE7a (den\xFAncias e bloqueios) e fazer o app funcionar. N\xE3o vendemos seus dados, n\xE3o fazemos publicidade e n\xE3o criamos perfis para an\xFAncios."],["4. Quem v\xEA o qu\xEA","Seu perfil (apelido, idade, cidade, bio, gostos, fotos, \xE1udio) aparece no Explorar para outros usu\xE1rios, a menos que voc\xEA pause o perfil ou algu\xE9m bloqueie voc\xEA. Seu e-mail nunca aparece para outras pessoas. Suas mensagens s\xF3 s\xE3o vis\xEDveis para voc\xEA e para a outra pessoa da conversa. As mensagens n\xE3o t\xEAm criptografia de ponta a ponta: a equipe t\xE9cnica, com acesso ao banco de dados, poderia l\xEA-las em casos de seguran\xE7a ou exig\xEAncia legal."],["5. Onde ficam os dados","Em servi\xE7os de terceiros que prestam a infraestrutura: Supabase (banco de dados, login e arquivos; servidores no Brasil, regi\xE3o S\xE3o Paulo) e GitHub Pages (hospedagem do site). Eles tratam os dados s\xF3 para nos prestar o servi\xE7o."],["6. Por quanto tempo","Enquanto sua conta existir. Ao excluir a conta, apagamos seu perfil, fotos, \xE1udio, curtidas, bloqueios, den\xFAncias feitas por voc\xEA e mensagens. C\xF3pias de seguran\xE7a do provedor podem levar um tempo para desaparecer. Dados que a lei nos obrigue a guardar podem ser mantidos pelo prazo legal."],["7. Seus direitos",`Pela LGPD voc\xEA pode pedir confirma\xE7\xE3o de que tratamos seus dados, acesso, corre\xE7\xE3o, portabilidade, informa\xE7\xE3o sobre compartilhamento e a elimina\xE7\xE3o dos dados. Voc\xEA mesmo corrige o perfil no app e exclui a conta em Perfil \u2192 Excluir minha conta. Para os demais pedidos escreva para ${Vh}.`],["8. Armazenamento no seu aparelho","O app guarda no seu navegador/aparelho a sess\xE3o de login e prefer\xEAncias (como tema, filtros e dicas j\xE1 vistas), e usa um servi\xE7o de instala\xE7\xE3o (PWA) para funcionar como app. O NEXO n\xE3o usa cookies de rastreamento nem ferramentas de an\xE1lise. Exce\xE7\xE3o: ao abrir uma sala de assistir junto, carregamos o player do YouTube (Google), que pode usar cookies e coletar dados segundo a pol\xEDtica do pr\xF3prio YouTube. Isso s\xF3 acontece quando voc\xEA abre uma sala desse tipo."],["9. Menores de idade","O NEXO \xE9 s\xF3 para maiores de 18 anos. Se soubermos que uma conta \xE9 de menor, ela ser\xE1 exclu\xEDda. Se voc\xEA souber de um caso, denuncie o perfil no app ou escreva para o contato acima."],["10. Seguran\xE7a e mudan\xE7as","Usamos regras de acesso no banco de dados para que cada pessoa s\xF3 veja o que pode ver, e conex\xE3o segura (HTTPS). Nenhum sistema \xE9 100% seguro. Se esta pol\xEDtica mudar de forma relevante, avisaremos no app."]];function qc({initial:e="terms",onClose:t}){let[a,n]=(0,Su.useState)(e);return(0,Ke.jsx)("div",{className:"modal-bg",onClick:t,children:(0,Ke.jsxs)("div",{className:"modal rules-box legal",id:"legal-modal",role:"dialog","aria-label":"Termos e privacidade",onClick:o=>o.stopPropagation(),children:[(0,Ke.jsxs)("div",{className:"between",children:[(0,Ke.jsx)("h2",{style:{fontSize:22},children:a==="terms"?"Termos de uso":"Pol\xEDtica de privacidade"}),(0,Ke.jsx)("button",{className:"x2","aria-label":"Fechar",onClick:t,children:"\xD7"})]}),(0,Ke.jsxs)("div",{className:"seg",style:{marginBottom:8},children:[(0,Ke.jsx)("button",{type:"button",id:"legal-terms",className:a==="terms"?"on":"",onClick:()=>n("terms"),children:"Termos"}),(0,Ke.jsx)("button",{type:"button",id:"legal-privacy",className:a==="privacy"?"on":"",onClick:()=>n("privacy"),children:"Privacidade"})]}),(0,Ke.jsxs)("p",{className:"muted small-t",children:["Vers\xE3o de ",zC," \xB7 linguagem simples, sem pegadinha."]}),(0,Ke.jsx)("div",{className:"legal-body",children:(a==="terms"?DC:qC).map(([o,i])=>(0,Ke.jsxs)("section",{children:[(0,Ke.jsx)("h3",{children:o}),(0,Ke.jsx)("p",{children:i})]},o))}),(0,Ke.jsx)("button",{className:"btn full",id:"legal-close",onClick:t,children:"Fechar"})]})})}function RS({email:e,onConfirm:t,onClose:a}){let[n,l]=(0,Su.useState)(""),[o,i]=(0,Su.useState)(!1),[c,r]=(0,Su.useState)(""),m=n.trim().toUpperCase()==="EXCLUIR"&&!o;return(0,Ke.jsx)("div",{className:"modal-bg",onClick:o?void 0:a,children:(0,Ke.jsxs)("div",{className:"modal",id:"delete-modal",role:"dialog","aria-label":"Excluir conta",onClick:y=>y.stopPropagation(),children:[(0,Ke.jsx)("h2",{style:{fontSize:22},children:"Excluir minha conta"}),(0,Ke.jsxs)("p",{children:["Isso apaga ",(0,Ke.jsx)("b",{children:"para sempre"})," a conta ",e?(0,Ke.jsx)("b",{children:e}):null,": seu perfil, fotos, \xE1udio, curtidas, matches e conversas. N\xE3o d\xE1 para desfazer."]}),(0,Ke.jsxs)(
